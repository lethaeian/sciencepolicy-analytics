<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計">
<meta name="description" content="数字と色面だけの家計簿。金額・費目・日付の三つしか置かない。">
<title>家計 — 数字だけの家計簿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ── 設計の方針 ───────────────────────────────
     参考にした画面の作りにならい、言葉をほとんど置かない。
     費目は絵の丸、種別は矢印、量は帯の幅・液面の高さ・点の大きさで示す。
     読ませるのは金額の数字だけ。四枚の画面はそれぞれ地の色を変え、
     地は黒（今月）と生成り（電卓・貯・暦）の二色。入力の画面だけは
     ブラウン ET66 の組み立て（液晶・まるい鍵・差し色の鍵ひとつ）を借りる。
     ───────────────────────────────────────── */
  :root{
    color-scheme: dark;
    --orange:  #ff5b34;
    --yellow:  #ffd23f;
    --pink:    #f3a8d8;
    --green:   #3ddc84;
    --blue:    #8ab4ff;
    --lilac:   #c9b8ff;
    --stone:   #b9b3a8;

    --accent:  #ff5b34;   /* 差し色。決定の鍵・今日・液体に使う */
    --cream:   #f4f1e3;   /* 生成り。電卓・貯・暦の地 */

    --grot:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Noto Sans Mono",monospace;

    --dots: 34px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:#0d0d0d; color:#f4f2ee;
    font-family:var(--grot);
    font-feature-settings:"palt" 1; font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  button{ font-family:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; }

  .shell{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    max-width:520px; margin:0 auto;
  }

  /* ── 三枚の窓：横に送る ───────────────────── */
  .strip{
    flex:1 1 auto; min-height:0;
    display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:none; -ms-overflow-style:none;
    overscroll-behavior-x:contain;
  }
  .strip::-webkit-scrollbar{ display:none; }
  .pane{
    flex:0 0 100%; width:100%; height:100%;
    scroll-snap-align:center; scroll-snap-stop:always;
    display:flex; flex-direction:column;
    overflow-y:auto; overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;
  }
  .pane.dark{ background:#0d0d0d; color:#f4f2ee; --ghost:rgba(244,242,238,.26); --rule:rgba(244,242,238,.14); --soft:rgba(244,242,238,.10); }
  .pane.hot { background:var(--orange); color:#0d0d0d;  --ghost:rgba(13,13,13,.30);  --rule:rgba(13,13,13,.20);  --soft:rgba(13,13,13,.10); }
  .pane.pale{ background:#e9e6df; color:#0d0d0d;        --ghost:rgba(13,13,13,.26);  --rule:rgba(13,13,13,.16);  --soft:rgba(13,13,13,.07); }

  /* ── 大きな見出し ─────────────────────────── */
  .display{
    margin:0; font-weight:800; letter-spacing:-.035em;
    font-size:clamp(38px,13vw,60px); line-height:.94;
  }
  .display .ghost{ color:var(--ghost); }
  #topcat .ghost{ display:block; margin-top:8px; }
  .display .yen{ font-size:.52em; letter-spacing:0; vertical-align:.14em; margin-right:.04em; }
  .ghost{ color:var(--ghost); }

  .micro{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ghost);
  }

  /* ── 丸いしるし ───────────────────────────── */
  .chip{
    width:40px; height:40px; flex:0 0 40px; border-radius:50%;
    display:grid; place-items:center;
    font-size:15px; font-weight:800; line-height:1; color:#0d0d0d;
    background:var(--soft);
  }
  .chip.sm{ width:30px; height:30px; flex-basis:30px; font-size:12px; }
  .chip.lg{ width:46px; height:46px; flex-basis:46px; font-size:17px; }
  .chip.hollow{ background:none; border:1.5px solid var(--rule); color:inherit; }
  .chip.ink{ background:#0d0d0d; color:#fff; }
  .chip.pressable{ transition:transform .12s ease; }
  .chip.pressable:active{ transform:scale(.9); }

  /* 費目は文字ではなく絵で示す。色と形の二重の手がかりで見分ける。 */
  .ic{ display:block; width:19px; height:19px; fill:currentColor; }
  .chip.sm .ic{ width:16px; height:16px; }
  .cats .chip .ic{ width:23px; height:23px; }
  .ic.big{ width:clamp(46px,15vw,66px); height:clamp(46px,15vw,66px); }

  .marks{ display:flex; gap:8px; align-items:center; }

  /* ── 今月（黒） ───────────────────────────── */
  .topline{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .topline .nav{
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    font-size:17px; line-height:1; color:var(--ghost); border:1.5px solid var(--rule);
  }
  .topline .nav:active{ color:inherit; }
  .topline .sp{ flex:1 1 auto; }

  .head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .head .marks{ padding-top:6px; }

  .flow{ margin:16px -4px 0; }
  .flow svg{ display:block; width:100%; height:auto; }

  .band{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding:12px 0 8px; margin-top:6px;
    border-bottom:1.5px solid currentColor;
  }
  .band b{ font-size:15px; font-weight:800; letter-spacing:-.01em; }

  .rows{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--rule);
    -webkit-user-select:none; user-select:none;
  }
  .row .amt{ font-size:27px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .row .amt .yen{ font-size:.55em; vertical-align:.12em; margin-right:.06em; }
  .row .when{ display:block; margin-top:4px; }
  .row .sp{ flex:1 1 auto; }
  .row.gone{ opacity:0; transform:translateX(-14px); transition:opacity .18s, transform .18s; }
  .empty{ padding:26px 0 8px; }

  /* ── 入力（電卓）───────────────────────────
     組み立ては ET66 にならう（液晶・まるい鍵の格子・差し色の鍵ひとつ）。
     色と字は暦の画面にそろえた生成りと墨。立体には見せず、盤に一段
     窪ませた面として置く。鍵の直径は列の幅と画面の高さから決め、
     余った縦の余白は行の間へ均等に配る。 */
  .pane.calc{
    background:var(--cream); color:#0d0d0d;
    --ghost:rgba(13,13,13,.26); --rule:rgba(13,13,13,.16); --soft:rgba(13,13,13,.06);
    --sunk:inset 0 1px 2px rgba(13,13,13,.16);
    --sunk-deep:inset 0 2px 5px rgba(13,13,13,.22);
    /* 鍵の直径の上限。実際は行の高さとこの値の小さいほうになる。
       列の幅より一回り小さく取り、余った分は鍵と鍵の間になる。 */
    --kmax:70px;
    --kmax:min( calc((min(100vw,520px) - 52px) / 3 - 20px), 72px );
    padding-bottom:10px;
  }
  .kinds{ display:flex; align-items:center; gap:9px; margin-bottom:16px; }
  .kinds .sp{ flex:1 1 auto; }
  .kinds .chip{ background:var(--soft); box-shadow:var(--sunk); color:#0d0d0d; }
  .kinds .chip[aria-pressed="true"]{ background:#0d0d0d; color:var(--cream); box-shadow:none; }

  /* 液晶も一段窪んだ面。数字は電卓と同じく右へ寄せる。 */
  .lcd{
    background:rgba(13,13,13,.05); color:#0d0d0d; border-radius:10px;
    padding:13px 15px 14px; margin-bottom:18px;
    box-shadow:var(--sunk);
    display:flex; flex-direction:column; justify-content:space-between; gap:6px;
    flex:0 1 auto; min-height:96px; max-height:136px;
  }
  .lcd .line{ display:flex; align-items:center; gap:8px; min-height:18px; }
  .lcd .line .sp{ flex:1 1 auto; }
  .lcd .mark{ display:grid; place-items:center; width:18px; height:18px; }
  .lcd .mark .ic{ width:16px; height:16px; }
  .amount{
    margin:0; text-align:right; white-space:nowrap;
    font-size:clamp(38px,12vw,54px); line-height:1;
    font-weight:800; letter-spacing:-.035em;
  }
  .amount.long{ font-size:clamp(26px,8.5vw,40px); }
  .amount.zero .num{ color:var(--ghost); }

  /* 費目は色のついた丸い鍵。色は暦や帯の図と同じものを使う。 */
  .cats{ display:flex; justify-content:space-between; gap:6px; margin-bottom:16px; }
  .cats .chip{
    width:44px; height:44px; flex:0 0 44px; border-radius:50%;
    background:var(--c,var(--soft)); box-shadow:var(--sunk); color:#0d0d0d;
  }
  .cats .chip[aria-pressed="true"]{ background:#0d0d0d; color:var(--cream); box-shadow:none; }

  .meter{ height:2px; border-radius:1px; background:rgba(13,13,13,.10); overflow:hidden; margin-bottom:14px; }
  .meter i{ display:block; height:100%; background:var(--accent); width:0; transition:width .3s ease; }

  .pad{
    flex:1 1 auto; min-height:190px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); gap:20px 8px;
  }
  .key{
    height:min(100%, var(--kmax)); width:auto; aspect-ratio:1; place-self:center;
    border-radius:50%; background:var(--soft); box-shadow:var(--sunk);
    color:#0d0d0d; font-size:22px; font-weight:700; letter-spacing:-.02em;
    display:grid; place-items:center;
    transition:background .1s ease, box-shadow .1s ease;
  }
  .key:active, .enter:active{ background:rgba(13,13,13,.13); box-shadow:var(--sunk-deep); }
  .key.fn{ color:rgba(13,13,13,.55); }

  /* 決定は ET66 の「＝」の位置に、差し色の丸で置く。 */
  .enterrow{ display:flex; align-items:center; gap:10px; margin-top:10px; padding-bottom:env(safe-area-inset-bottom); }
  .enterrow .sp{ flex:1 1 auto; }
  .lamps{ display:flex; align-items:center; gap:13px; padding-left:8px; }
  .lamps i{ width:8px; height:8px; border-radius:50%; box-shadow:var(--sunk); }
  /* 実機の電源表示にあたる小さな飾り。差し色とぶつからない深い緑と煉瓦。 */
  .lamps i.on{ background:#2f7d4f; }
  .lamps i.off{ background:#b8442e; }
  .enter{
    flex:0 0 auto; width:var(--kmax); height:var(--kmax); border-radius:50%;
    background:var(--accent); color:#0d0d0d; box-shadow:var(--sunk);
    font-size:21px; font-weight:700;
    display:grid; place-items:center;
    transition:background .1s ease, box-shadow .1s ease;
  }
  .enter:active{ background:#e14e2b; box-shadow:var(--sunk-deep); }
  .enter[disabled]{ background:rgba(13,13,13,.08); color:var(--ghost); }

  /* ── 貯（溜まる液体）───────────────────────
     暦の画面と同じ生成りの地。器の輪郭は描かず、溜まった液体そのものが
     形になる。数字は液面の上下で色が入れ替わる。 */
  .pane.save{
    background:var(--cream); color:#0d0d0d;
    --ghost:rgba(13,13,13,.26); --rule:rgba(13,13,13,.16); --soft:rgba(13,13,13,.07);
  }
  .savehead{ display:flex; align-items:center; gap:10px; }
  .savehead .sp{ flex:1 1 auto; }
  /* 週の七日。休日は輪、平日は点。今日は橙。 */
  .week{ display:flex; gap:7px; align-items:center; }
  .week i{ width:9px; height:9px; border-radius:50%; background:#0d0d0d; opacity:.22; }
  .week i.past{ opacity:.75; }
  .week i.holi{ background:none; box-shadow:inset 0 0 0 2px #0d0d0d; }
  .week i.now{ background:var(--accent); opacity:1; box-shadow:none; transform:scale(1.3); }

  .tank{ flex:1 1 auto; display:grid; place-items:center; min-height:0; padding:10px 0; }
  .tank svg{ display:block; width:100%; height:100%; max-height:min(54vh,320px); }

  /* 設定は暦の画面と同じ、罫と太い数字だけの組み。 */
  .rates{
    display:flex; align-items:flex-end; gap:16px;
    border-top:1.5px solid currentColor; padding:12px 0 calc(env(safe-area-inset-bottom) + 6px);
  }
  .rate{ flex:1 1 0; text-align:left; }
  .rate .micro{ display:block; }
  .rate b{ display:block; margin-top:4px; font-size:21px; font-weight:800; letter-spacing:-.02em; }
  .rate:active b{ opacity:.5; }
  .rates .chip{ flex:0 0 30px; }

  /* ── 暦（生成り） ─────────────────────────── */
  .pane.cal{
    background:#f4f1e3; color:#0d0d0d; position:relative;
    --ghost:rgba(13,13,13,.26); --rule:rgba(13,13,13,.14); --soft:rgba(13,13,13,.07);
    padding-left:60px;
  }
  /* 参考にした画面と同じく、月は左端に縦へ置く。 */
  .vtitle{
    position:absolute; left:12px; top:calc(env(safe-area-inset-top) + 14px);
    writing-mode:vertical-rl;
    font-size:28px; font-weight:800; letter-spacing:.01em; line-height:1;
  }
  .calhead{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .calhead .marks{ gap:8px; }
  .calhead .nav{
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    font-size:17px; line-height:1; color:var(--ghost); border:1.5px solid var(--rule);
  }
  .grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:13px 8px;
    width:100%; max-width:290px; margin:0 auto; padding:26px 0 22px;
  }
  .day{ height:28px; display:grid; place-items:center; }
  .day i{ display:block; border-radius:50%; background:#0d0d0d; transition:transform .12s ease; }
  .day:active i{ transform:scale(.82); }
  .daysum{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:10px 0 8px; border-bottom:1.5px solid currentColor;
  }
  .daysum b{ font-size:27px; font-weight:800; letter-spacing:-.03em; }
  .daysum b .yen{ font-size:.55em; vertical-align:.12em; margin-right:.06em; }
  .pane.cal .rows{ padding-bottom:calc(env(safe-area-inset-bottom) + 6px); }
  .row.mini{ padding:9px 0; }
  .row.mini .amt{ font-size:21px; }

  /* ── 下の点 ───────────────────────────────── */
  .dots{
    flex:0 0 var(--dots); display:flex; align-items:center; justify-content:center; gap:7px;
    background:#0d0d0d; padding-bottom:env(safe-area-inset-bottom);
    box-sizing:content-box;
  }
  .dots i{ width:6px; height:6px; border-radius:50%; background:rgba(244,242,238,.26); transition:background .2s; }
  .dots i.on{ background:#f4f2ee; }

  @media (max-height:680px){
    .display{ font-size:clamp(32px,10vw,46px); }
    /* 縦が短い端末では、盤のまわりを詰めて鍵の大きさを保つ。 */
    .pane.calc{ --kmax:56px; }
    .pane.calc .kinds{ margin-bottom:10px; }
    .pane.calc .lcd{ min-height:76px; max-height:106px; margin-bottom:12px; }
    .pane.calc .cats{ margin-bottom:10px; }
    .pane.calc .cats .chip{ width:38px; height:38px; flex-basis:38px; }
    .pane.calc .meter{ margin-bottom:10px; }
    .pane.calc .pad{ min-height:150px; gap:13px 6px; }
    .pane.calc .enterrow{ margin-top:7px; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="strip" id="strip">

    <!-- ① 今月 ─────────────────────────────── -->
    <section class="pane dark" id="p0">
      <div class="topline">
        <button class="nav" id="prev" aria-label="前の月">‹</button>
        <button class="nav" id="next" aria-label="次の月">›</button>
        <span class="sp"></span>
        <span class="micro" id="ym">2026.08</span>
      </div>

      <div class="head">
        <h1 class="display" id="total"><span class="yen">¥</span>0</h1>
        <div class="marks">
          <span class="chip" id="pct" style="background:var(--yellow)">0%</span>
          <span class="chip hollow" id="left">0</span>
        </div>
      </div>

      <div class="flow" id="flow"></div>

      <div class="band">
        <b id="bandL">0</b>
        <span class="micro" id="bandR">残 —</span>
      </div>

      <div class="rows" id="rows"></div>
    </section>

    <!-- ② 入力（電卓）───────────────────────── -->
    <section class="pane calc" id="p1">
      <div class="kinds">
        <button class="chip pressable" id="kOut" aria-pressed="true">↗</button>
        <button class="chip pressable" id="kIn" aria-pressed="false">↘</button>
        <span class="sp"></span>
        <span class="micro" id="mode">2026.08</span>
      </div>

      <div class="lcd">
        <div class="line">
          <span class="mark" id="lcdMark"></span>
          <span class="sp"></span>
          <span class="micro" id="lcdNote">—</span>
        </div>
        <h2 class="amount zero" id="amount"><span class="num">0</span></h2>
      </div>

      <div class="cats" id="cats"></div>

      <div class="meter"><i id="meter"></i></div>

      <div class="pad" id="pad"></div>

      <div class="enterrow">
        <span class="lamps" aria-hidden="true"><i class="on"></i><i class="off"></i></span>
        <span class="sp"></span>
        <button class="enter" id="enter" disabled aria-label="記録する">↙</button>
      </div>
    </section>

    <!-- ③ 貯（溜まる液体）────────────────────── -->
    <section class="pane save" id="p2">
      <div class="savehead">
        <div class="week" id="week"></div>
        <span class="sp"></span>
        <span class="micro" id="weekrange">—</span>
      </div>

      <div class="tank" id="tank"></div>

      <div class="rates">
        <button class="rate" id="rateWd">
          <span class="micro">◎ 平日 / 日</span><b>—</b>
        </button>
        <button class="rate" id="rateHe">
          <span class="micro">◎ 休日 / 日</span><b>—</b>
        </button>
        <div class="rate" aria-hidden="true">
          <span class="micro">週</span><b id="weekN">—</b>
        </div>
        <button class="chip sm hollow pressable" id="wipe" aria-label="全部消す">✕</button>
      </div>
    </section>

    <!-- ④ 暦 ───────────────────────────────── -->
    <section class="pane cal" id="p3">
      <span class="vtitle" id="vtitle">2026.08</span>

      <div class="calhead">
        <span class="micro" id="calsum">¥0</span>
        <div class="marks">
          <button class="nav" id="cprev" aria-label="前の月">‹</button>
          <button class="nav" id="cnext" aria-label="次の月">›</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>

      <div class="daysum">
        <b id="daytotal"><span class="yen">¥</span>0</b>
        <span class="micro" id="daymeta">—</span>
      </div>

      <div class="rows" id="dayrows"></div>
    </section>

  </div>

  <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>
</div>

<script>
(function(){
"use strict";

/* ── 費目：絵と色だけで見分ける ───────────────
   k は内部の呼び名で、画面には出さない（読み上げの名前にだけ使う）。
   橙は入力画面の地色と警告に使うので、費目には割り当てない。 */
var CATS = [
  { k:"食", c:"var(--yellow)" },
  { k:"住", c:"var(--lilac)"  },
  { k:"移", c:"var(--green)"  },
  { k:"遊", c:"var(--pink)"   },
  { k:"医", c:"var(--blue)"   },
  { k:"他", c:"var(--stone)"  }
];

/* 24×24の枠に描いた絵。色は文字色に従うので、黒の丸でも白抜きでも使える。 */
var ICONS = {
  "食": '<rect x="2.4" y="9.2" width="19.2" height="2.4" rx="1.2"/>'
      + '<path d="M4.3 13.2h15.4a7.7 7.7 0 0 1-15.4 0z"/>',

function ic(k, cls){
  return '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">'
       + (ICONS[k] || ICONS["他"]) + '</svg>';

function catOf(k){
  for(var i=0;i<CATS.length;i++){ if(CATS[i].k === k) return CATS[i]; }
  return CATS[CATS.length-1];

/* ── 保存 ─────────────────────────────────── */
var KEY = "kakeibo.v1";
/* rates は一日あたりの予算。wd=平日 / he=休日（土日）。
   月の予算はここから日を数えて出すので、月ごとに持つ必要がない。 */
var db = { entries:[], budgets:{}, rates:{ wd:0, he:0 } };

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(o && Array.isArray(o.entries)) db.entries = o.entries;
    if(o && o.budgets && typeof o.budgets === "object") db.budgets = o.budgets;
    if(o && o.rates && typeof o.rates === "object"){
      db.rates.wd = o.rates.wd || 0;
      db.rates.he = o.rates.he || 0;
    }
  }catch(e){ /* 壊れていたら空から始める */ }

  /* 前の版で月ごとに入れていた予算を、一日あたりに均して引き継ぐ。 */
  if(!db.rates.wd && !db.rates.he){
    var keys = Object.keys(db.budgets).sort();
    if(keys.length){
      var per = Math.round((db.budgets[keys[keys.length-1]] || 0) / 30 / 10) * 10;
      if(per > 0){ db.rates.wd = per; db.rates.he = per; save(); }
    }
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ /* 容量超過などは黙って諦める。画面の値は生きている */ }
}

/* ── 月まわり ─────────────────────────────── */
var view = new Date();
view.setDate(1);

function ymOf(d){
  return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2);
}
function ym(){ return ymOf(view); }
function isThisMonth(){ return ym() === ymOf(new Date()); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function daysLeft(){
  if(!isThisMonth()) return 0;
  var now = new Date();
  return daysInMonth(view) - now.getDate() + 1;
}
function monthEntries(){
  var m = ym();
  return db.entries.filter(function(e){ return e.ym === m; })
                   .sort(function(a,b){ return b.ts - a.ts; });
}
function sums(){
  var out = 0, inn = 0, per = {};
  CATS.forEach(function(c){ per[c.k] = 0; });
  monthEntries().forEach(function(e){
    if(e.kind === "in"){ inn += e.amt; }
    else { out += e.amt; per[e.k] = (per[e.k] || 0) + e.amt; }
  });
  return { out:out, in:inn, per:per };
}
/* 土日を休日とする。祝日の暦は持たない。 */
function isHoliday(d){ var w = d.getDay(); return w === 0 || w === 6; }
function rateOf(d){ return isHoliday(d) ? db.rates.he : db.rates.wd; }
function weekPlan(){ return db.rates.wd*5 + db.rates.he*2; }

/* 月の予算は、その月の平日・休日を数えて出す。 */
function budget(){
  if(!db.rates.wd && !db.rates.he) return 0;
  var y = view.getFullYear(), m = view.getMonth(), n = daysInMonth(view), t = 0;
  for(var d=1; d<=n; d++) t += rateOf(new Date(y, m, d));
  return t;
}

var yen = function(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); };
var num = function(n){ return Math.round(n).toLocaleString("ja-JP"); };

/* ── ①今月：帯のグラフ ─────────────────────
   費目ごとの太さが金額の比。左端の並びと右端の並びを逆にして、
   帯どうしが交差するようにしている。金額が無い月は薄い placeholder。 */
function drawFlow(){
  var host = document.getElementById("flow");
  var W = 320, H = 136, x0 = 10, x1 = W - 10, gap = 6;
  var s = sums(), list = [];
  CATS.forEach(function(c){ if(s.per[c.k] > 0) list.push({ k:c.k, c:c.c, v:s.per[c.k] }); });

  var ghostMode = list.length === 0;
  if(ghostMode){ list = CATS.slice(0,4).map(function(c){ return { k:c.k, c:c.c, v:1 }; }); }

  var n = list.length;
  var total = list.reduce(function(a,d){ return a + d.v; }, 0) || 1;
  var room = H - gap*(n-1);
  /* 一本が太りすぎると図が塊になるので上下を抑える。比は残す。 */
  var w = list.map(function(d){
    return ghostMode ? 8 : Math.min(34, Math.max(8, room * d.v/total));
  });
  var sum = w.reduce(function(a,b){ return a+b; }, 0);
  if(sum > room){ var k = room/sum; w = w.map(function(v){ return v*k; }); sum = room; }

  var top = (H - (sum + gap*(n-1)))/2;   /* 縦の中央に寄せる */
  var yL = [], yR = [], acc = top, i;
  for(i=0;i<n;i++){ yL.push(acc + w[i]/2); acc += w[i] + gap; }
  acc = top;
  for(i=n-1;i>=0;i--){ yR[i] = acc + w[i]/2; acc += w[i] + gap; }

  var m1 = x0 + (x1-x0)*.42, m2 = x0 + (x1-x0)*.58;
  function band(i){
    return 'M '+x0+' '+yL[i].toFixed(1)+' C '+m1+' '+yL[i].toFixed(1)
         + ', '+m2+' '+yR[i].toFixed(1)+', '+x1+' '+yR[i].toFixed(1);
  }

  /* 太い順に描く。細い帯があとから黒い縁ごと重なるので、
     交差しても路線図のように一本ずつ見分けられる。 */
  var order = [];
  for(i=0;i<n;i++) order.push(i);
  order.sort(function(a,b){ return w[b] - w[a]; });

  var svg = ['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="費目ごとの割合">'];
  svg.push('<g opacity="'+(ghostMode ? .12 : 1)+'">');
  order.forEach(function(i){
    if(!ghostMode){
      svg.push('<path d="'+band(i)+'" fill="none" stroke="#0d0d0d" stroke-width="'+(w[i]+5).toFixed(1)+'"/>');
    }
    svg.push('<path d="'+band(i)+'" fill="none" stroke="'+list[i].c+'" stroke-width="'+w[i].toFixed(1)+'"/>');
  });
  if(!ghostMode){
    for(i=0;i<n;i++){
      var r = Math.min(3.2, w[i]/2.6);
      svg.push('<circle cx="'+x0+'" cy="'+yL[i].toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#0d0d0d"/>');
      svg.push('<circle cx="'+x1+'" cy="'+yR[i].toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#0d0d0d"/>');
    }
  }
  svg.push('</g></svg>');
  host.innerHTML = svg.join("");
}

/* ── 明細の一行。今月の画面と暦の画面で同じものを使う ───── */
var pressTimer = null;

function entryRow(e, mini){
  var c = catOf(e.k);
  var row = document.createElement("div");
  row.className = "row" + (mini ? " mini" : "");
  row.innerHTML =
    '<div><div class="amt">' + (e.kind === "in" ? "+" : "") + '<span class="yen">¥</span>' + num(e.amt) + '</div>'
    + '<span class="micro when">' + e.d + '</span></div>'
    + '<span class="sp"></span>'
    + '<span class="chip sm" style="background:' + c.c + '" role="img" aria-label="' + c.k + '">' + ic(c.k) + '</span>'
    + '<span class="chip sm hollow">' + (e.kind === "in" ? "↘" : "↗") + '</span>';

  /* 長押しで一件消す。誤操作を減らすため確認をはさむ。 */
  var start = function(){
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function(){
      if(confirm(yen(e.amt) + " を消しますか？")){
        row.classList.add("gone");
        setTimeout(function(){
          db.entries = db.entries.filter(function(x){ return x.id !== e.id; });
          save(); renderAll();
        }, 170);
      }
    }, 550);
  };
  var stop = function(){ clearTimeout(pressTimer); };
  row.addEventListener("touchstart", start, { passive:true });
  row.addEventListener("touchend", stop);
  row.addEventListener("touchmove", stop, { passive:true });
  row.addEventListener("mousedown", start);
  row.addEventListener("mouseup", stop);
  row.addEventListener("mouseleave", stop);
  return row;
}

/* ── ①今月：明細 ─────────────────────────── */
function drawMonth(){
  var s = sums(), b = budget(), list = monthEntries();

  document.getElementById("ym").textContent = ym().replace("-", ".");
  document.getElementById("total").innerHTML = '<span class="yen">¥</span>' + num(s.out);

  var pct = b > 0 ? Math.round(s.out / b * 100) : 0;
  var pctEl = document.getElementById("pct");
  pctEl.textContent = b > 0 ? pct + "%" : "—";
  pctEl.style.background = (b > 0 && pct > 100) ? "var(--orange)" : "var(--yellow)";

  var leftEl = document.getElementById("left");
  leftEl.textContent = isThisMonth() ? daysLeft() : list.length;

  document.getElementById("bandL").textContent = b > 0 ? yen(Math.max(0, b - s.out)) : yen(s.out);
  document.getElementById("bandR").textContent =
    (b > 0 ? "残 · " : "支出 · ") + (s.in > 0 ? "+" + yen(s.in) : list.length + "件");

  var host = document.getElementById("rows");
  host.innerHTML = "";
  if(!list.length){
    var p = document.createElement("p");
    p.className = "micro empty";
    p.textContent = "→ swipe to add";
    host.appendChild(p);
    drawFlow();
    return;
  }

  list.forEach(function(e){ host.appendChild(entryRow(e)); });

  drawFlow();
}

/* ── ③貯：週の予算との差を、溜まる液体で示す ──────────
   週は月曜はじまり。経過した日ぶんの予算から、その間に使った額を
   引いたものが「貯まった額」。円のなかの液面がその比を表す。
   液面は二枚の波を別々の速さで動かし、止まって見えないようにする。 */
function weekStart(){
  var d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   /* 月曜へ戻す */
  return d;
}
function entryDate(e){
  var p = String(e.ym).split("-");
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, dayOf(e));
}
function savings(){
  var s0 = weekStart(), now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var plan = 0, days = [];
  for(var d = new Date(s0); d <= today; d.setDate(d.getDate()+1)){
    plan += rateOf(d);
    days.push(new Date(d));
  }
  var spent = 0;
  db.entries.forEach(function(e){
    if(e.kind === "in") return;
    var t = entryDate(e);
    if(t >= s0 && t <= today) spent += e.amt;
  });
  return { start:s0, today:today, plan:plan, spent:spent, saved:plan - spent, elapsed:days.length };
}

var tankState = { level:0, target:0, phase:0, raf:0, label:"—", over:false };

function drawSave(){
  var s = savings(), wp = weekPlan();

  /* 週の七日。休日は輪、平日は点。今日は橙。 */
  var host = document.getElementById("week");
  host.innerHTML = "";
  for(var i=0;i<7;i++){
    var d = new Date(s.start); d.setDate(d.getDate()+i);
    var cls = "";
    if(isHoliday(d)) cls += " holi";
    if(i < s.elapsed - 1) cls += " past";
    if(i === s.elapsed - 1) cls += " now";
    host.innerHTML += '<i class="' + cls.trim() + '"></i>';
  }

  var e = s.start, f = new Date(s.start); f.setDate(f.getDate()+6);
  document.getElementById("weekrange").textContent =
    (e.getMonth()+1) + "/" + e.getDate() + " — " + (f.getMonth()+1) + "/" + f.getDate();

  document.querySelector("#rateWd b").textContent = db.rates.wd ? yen(db.rates.wd) : "—";
  document.querySelector("#rateHe b").textContent = db.rates.he ? yen(db.rates.he) : "—";
  document.getElementById("weekN").textContent = wp > 0 ? yen(wp) : "—";

  /* 液面は「経過した日ぶんの予算のうち、どれだけ残せたか」。
     一日でも使わなければ満ちるので、日々の増減が目に見える。 */
  tankState.target = s.plan > 0 ? Math.max(0, Math.min(1, s.saved / s.plan)) : 0;
  tankState.label  = wp > 0 ? (s.saved < 0 ? "−" : "") + yen(Math.abs(s.saved)) : "—";
  tankState.over   = wp > 0 && s.saved < 0;
  tankState.empty  = wp <= 0;
  buildTank();
}

/* 器と、そこに置く文字。波の形だけを毎こま書き換える。
   viewBox は正方形の固定寸で、実寸への拡大は CSS に任せる。 */
var TW = 300;

function buildTank(){
  var host = document.getElementById("tank");
  if(!host) return;
  var c = TW/2, r = TW/2 - 3, fs = TW * 0.17;
  var label = tankState.label || "—";
  var text = function(fill){
    return '<text x="'+c+'" y="'+c+'" text-anchor="middle" dominant-baseline="central" '
         + 'font-size="'+fs.toFixed(1)+'" font-weight="800" letter-spacing="-.03em" fill="'+fill+'">'
         + label + '</text>';
  };

  host.innerHTML =
    '<svg viewBox="0 0 '+TW+' '+TW+'" role="img" aria-label="貯まった額 ' + label + '">'
    + '<defs>'
    +   '<clipPath id="vessel"><circle cx="'+c+'" cy="'+c+'" r="'+r+'"/></clipPath>'
    +   '<clipPath id="lq"><path id="waveClip" d=""/></clipPath>'
    + '</defs>'
    + '<g clip-path="url(#vessel)">'
    /* 器そのものは描かない。溜まった液体だけが形になる。
       ただし予算を決める前だけは、破線の輪を置いて場所を示す。 */
    +   (tankState.empty
        ? '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="rgba(13,13,13,.16)" '
          + 'stroke-width="1.5" stroke-dasharray="3 8" stroke-linecap="round"/>'
        : '')
    +   text(tankState.over ? "#ff5b34" : "#0d0d0d")
    +   '<path id="wave2" fill="rgba(255,91,52,.34)" d=""/>'
    +   '<path id="wave1" fill="#ff5b34" d=""/>'
    +   '<g clip-path="url(#lq)">' + text("#f4f1e3") + '</g>'
    + '</g>'
    + '</svg>';

  tankState.wave  = document.getElementById("wave1");
  tankState.wave2 = document.getElementById("wave2");
  tankState.clip  = document.getElementById("waveClip");
  tick(true);
}

function wavePath(level, phase, amp, freq){
  /* 液面より下を塗る多角形。左右は器の外まで伸ばして継ぎ目を隠す。 */
  var base = TW - level * (TW + amp*2) + amp;
  var d = "M -8 " + (base + Math.sin(phase) * amp).toFixed(1);
  for(var x = 0; x <= TW + 8; x += 8){
    d += " L " + x + " " + (base + Math.sin(phase + x/TW * freq * Math.PI*2) * amp).toFixed(1);
  }
  return d + " L " + (TW+8) + " " + (TW+8) + " L -8 " + (TW+8) + " Z";
}

function tick(once){
  tankState.raf = 0;
  if(!tankState.wave) return;

  tankState.level += (tankState.target - tankState.level) * (once ? 1 : .05);
  tankState.phase += .022;

  var amp = TW * 0.026;
  var d1 = wavePath(tankState.level, tankState.phase, amp, 1.6);
  tankState.wave.setAttribute("d", d1);
  tankState.clip.setAttribute("d", d1);
  tankState.wave2.setAttribute("d",
    wavePath(tankState.level, -tankState.phase * 1.45 + 1.2, amp * .72, 2.2));

  /* 見えている画面でだけ動かす。電池を無駄に使わない。 */
  if(!once && paneIndex() === 2 && !document.hidden){
    tankState.raf = requestAnimationFrame(function(){ tick(false); });
  }
}
function startTank(){
  if(!tankState.raf && tankState.wave) tankState.raf = requestAnimationFrame(function(){ tick(false); });
}

/* ── ②入力 ────────────────────────────────── */
var buf = "";              /* 打ち込み中の数字 */
var kind = "out";          /* out=支出 / in=収入 */
var pick = CATS[0].k;      /* 選んでいる費目 */
var mode = "entry";        /* entry=記録 / wd=平日の予算 / he=休日の予算 */

function buildCats(){
  var host = document.getElementById("cats");
  host.innerHTML = "";
  CATS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip pressable";
    b.style.setProperty("--c", c.c);
    b.innerHTML = ic(c.k);
    b.dataset.k = c.k;
    b.setAttribute("aria-pressed", c.k === pick ? "true" : "false");
    b.setAttribute("aria-label", c.k);
    b.addEventListener("click", function(){
      pick = c.k;
      drawInput();
    });
    host.appendChild(b);
  });
}

function buildPad(){
  var host = document.getElementById("pad");
  var keys = ["1","2","3","4","5","6","7","8","9","00","0","⌫"];
  keys.forEach(function(k){
    var b = document.createElement("button");
    b.className = "key" + (k === "⌫" ? " fn" : "");
    b.textContent = k;
    b.addEventListener("click", function(){
      if(k === "⌫"){ buf = buf.slice(0, -1); }
      else if(buf.length < 9){ buf = (buf === "0" ? "" : buf) + k; }
      if(buf.length > 9) buf = buf.slice(0, 9);
      drawInput();
    });
    host.appendChild(b);
  });
}

function drawInput(){
  var v = parseInt(buf || "0", 10);
  var amt = document.getElementById("amount");
  amt.className = "amount" + (v > 0 ? "" : " zero") + (String(v).length > 6 ? " long" : "");
  amt.innerHTML = '<span class="num">' + num(v) + '</span>';

  document.getElementById("kOut").setAttribute("aria-pressed", kind === "out" ? "true" : "false");
  document.getElementById("kIn").setAttribute("aria-pressed", kind === "in" ? "true" : "false");

  /* 予算を決めている間は、費目と種別を伏せる */
  var budgeting = mode !== "entry";
  document.getElementById("cats").style.display = budgeting ? "none" : "";
  document.getElementById("kOut").style.visibility = budgeting ? "hidden" : "";
  document.getElementById("kIn").style.visibility = budgeting ? "hidden" : "";
  document.getElementById("mode").textContent = ym().replace("-", ".");
  document.getElementById("enter").textContent = budgeting ? "◎" : "↙";
  document.getElementById("enter").disabled = v <= 0;

  /* 液晶の一行目：いま何を打っているのか（費目の絵か、予算の別）。 */
  document.getElementById("lcdMark").innerHTML = budgeting ? "◎" : ic(pick);
  document.getElementById("lcdMark").setAttribute("aria-label", budgeting ? "予算" : pick);
  document.getElementById("lcdNote").textContent =
    budgeting ? (mode === "wd" ? "平日 / 一日" : "休日 / 一日")
              : (kind === "in" ? "収入" : "支出");

  Array.prototype.forEach.call(document.getElementById("cats").children, function(b){
    b.setAttribute("aria-pressed", b.dataset.k === pick ? "true" : "false");
  });

  var s = sums(), b2 = budget();
  document.getElementById("meter").style.width =
    (b2 > 0 ? Math.min(100, s.out / b2 * 100) : 0) + "%";
}

function commit(){
  var v = parseInt(buf || "0", 10);
  if(v <= 0) return;
  var wasBudget = mode !== "entry";

  if(mode === "wd" || mode === "he"){
    db.rates[mode] = v;
    mode = "entry";
  }else{
    /* 今月なら今日。ほかの月を見ているときは、暦で選んでいる日に付ける。 */
    var now = new Date();
    var day = isThisMonth() ? now.getDate() : (pickDay || daysInMonth(view));
    db.entries.push({
      id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
      ts: isThisMonth() ? now.getTime() : new Date(view.getFullYear(), view.getMonth(), day, 12).getTime(),
      ym: ym(),
      day: day,
      d:  (view.getMonth()+1) + "/" + day,
      k:  pick,
      kind: kind,
      amt: v
    });
  }
  buf = "";
  save();
  renderAll();
  go(wasBudget ? 2 : 0);   /* 予算を決めたら貯の画面へ、記録したら今月へ戻る */
}

/* ── ④暦：日ごとの点 ───────────────────────
   点の大きさがその日の支出。数字を並べず、月の使い方の形だけを見せる。
   点を押すと、その日の明細が下に出る。 */
var pickDay = 0;

function dayOf(e){
  return e.day || parseInt(String(e.d).split("/")[1], 10) || 1;
}

function drawCal(){
  var y = view.getFullYear(), m = view.getMonth();
  var first = new Date(y, m, 1).getDay();      /* 日曜=0 から始める */
  var dim = daysInMonth(view);

  var per = {}, max = 0;
  monthEntries().forEach(function(e){
    if(e.kind === "in") return;
    var d = dayOf(e);
    per[d] = (per[d] || 0) + e.amt;
    if(per[d] > max) max = per[d];
  });

  /* 選ぶ日は、今月なら今日。ほかの月なら一番使った日。 */
  if(!pickDay || pickDay > dim){
    if(isThisMonth()){ pickDay = new Date().getDate(); }
    else{
      var best = 0, bestV = 0;
      for(var d0 in per){ if(per[d0] > bestV){ bestV = per[d0]; best = parseInt(d0, 10); } }
      pickDay = best || 1;
    }
  }

  document.getElementById("vtitle").textContent = ym().replace("-", ".");
  document.getElementById("calsum").textContent = yen(sums().out);

  var host = document.getElementById("grid");
  host.innerHTML = "";
  var cells = Math.ceil((first + dim)/7) * 7;
  for(var i=0;i<cells;i++){
    (function(i){
      var day = i - first + 1;
      var inMonth = day >= 1 && day <= dim;
      var v = inMonth ? (per[day] || 0) : 0;
      var on = inMonth && day === pickDay;

      var size = inMonth ? (v > 0 && max > 0 ? 8 + 10*Math.sqrt(v/max) : 8) : 6.5;
      /* 選んでいる日は、どの黒い点よりひとまわり大きくする。 */
      if(on) size = Math.max(size, 18) + 3;

      var b = document.createElement("button");
      b.className = "day";
      b.disabled = !inMonth;
      if(inMonth) b.setAttribute("aria-label", (m+1) + "月" + day + "日");
      b.innerHTML = '<i style="width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;'
        + 'background:' + (on ? "var(--orange)" : "#0d0d0d") + ';'
        + 'opacity:' + (on ? 1 : (inMonth ? (v > 0 ? 1 : .2) : .1)) + '"></i>';
      if(inMonth){
        b.addEventListener("click", function(){ pickDay = day; drawCal(); });
      }
      host.appendChild(b);
    })(i);
  }

  var list = monthEntries().filter(function(e){ return dayOf(e) === pickDay; });
  var out = 0;
  list.forEach(function(e){ if(e.kind !== "in") out += e.amt; });

  document.getElementById("daytotal").innerHTML = '<span class="yen">¥</span>' + num(out);
  document.getElementById("daymeta").textContent =
    (m+1) + "/" + pickDay + " · " + (list.length ? list.length + "件" : "—");

  var rows = document.getElementById("dayrows");
  rows.innerHTML = "";
  list.forEach(function(e){ rows.appendChild(entryRow(e, true)); });
}

/* ── 画面送り ─────────────────────────────── */
var strip = document.getElementById("strip");
function go(i){
  strip.scrollTo({ left: strip.clientWidth * i, behavior:"smooth" });
}
function paneIndex(){
  var i = Math.round(strip.scrollLeft / Math.max(1, strip.clientWidth));
  return i < 0 ? 0 : (i > 3 ? 3 : i);
}
/* 下の帯は、いま見ている画面の地色に合わせる。暗い三枚と明るい一枚。 */
var TONE = ["#0d0d0d", "#f4f1e3", "#f4f1e3", "#f4f1e3"];
var LIGHT_PANE = [false, true, true, true];

function syncDots(){
  var i = paneIndex();
  var dots = document.getElementById("dots").children;
  for(var j=0;j<dots.length;j++){ dots[j].className = (j === i ? "on" : ""); }
  document.querySelector(".dots").style.background = TONE[i];
  document.querySelector('meta[name="theme-color"]').setAttribute("content", TONE[i]);
  for(j=0;j<dots.length;j++){
    dots[j].style.background = dots[j].className === "on"
      ? (LIGHT_PANE[i] ? "#0d0d0d" : "#f4f2ee")
      : (LIGHT_PANE[i] ? "rgba(13,13,13,.24)" : "rgba(244,242,238,.26)");
  }
  /* 液体は見えている間だけ動かす。 */
  if(i === 2) startTank();
}
strip.addEventListener("scroll", function(){
  window.requestAnimationFrame(syncDots);
}, { passive:true });
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && paneIndex() === 2) startTank();
});

/* ── 組み立て ─────────────────────────────── */
function renderAll(){ drawMonth(); drawInput(); drawSave(); drawCal(); }

function shiftMonth(n){
  view.setMonth(view.getMonth() + n);
  pickDay = 0;            /* 月が変われば選ぶ日も選び直す */
  renderAll();
}
document.getElementById("prev").addEventListener("click", function(){ shiftMonth(-1); });
document.getElementById("next").addEventListener("click", function(){ shiftMonth(1); });
document.getElementById("cprev").addEventListener("click", function(){ shiftMonth(-1); });
document.getElementById("cnext").addEventListener("click", function(){ shiftMonth(1); });
document.getElementById("kOut").addEventListener("click", function(){ kind = "out"; drawInput(); });
document.getElementById("kIn").addEventListener("click", function(){ kind = "in"; drawInput(); });
document.getElementById("enter").addEventListener("click", commit);
/* 平日・休日それぞれの一日あたりの予算を、電卓で打ち込む。 */
document.getElementById("rateWd").addEventListener("click", function(){
  mode = "wd"; buf = ""; drawInput(); go(1);
});
document.getElementById("rateHe").addEventListener("click", function(){
  mode = "he"; buf = ""; drawInput(); go(1);
});
document.getElementById("wipe").addEventListener("click", function(){
  if(!db.entries.length && !db.rates.wd && !db.rates.he) return;
  if(confirm("記録と予算を全部消しますか？")){
    db = { entries:[], budgets:{}, rates:{ wd:0, he:0 } };
    pickDay = 0;
    tankState.level = 0;
    save(); renderAll();
  }
});

/* 物理キーボードからも打てるようにしておく（机上での確認用） */
document.addEventListener("keydown", function(ev){
  if(paneIndex() !== 1) return;
  if(ev.key >= "0" && ev.key <= "9"){ if(buf.length < 9) buf = (buf === "0" ? "" : buf) + ev.key; drawInput(); }
  else if(ev.key === "Backspace"){ buf = buf.slice(0, -1); drawInput(); }
  else if(ev.key === "Enter"){ commit(); }
});

window.addEventListener("resize", syncDots);

load();
buildCats();
buildPad();
renderAll();
syncDots();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
