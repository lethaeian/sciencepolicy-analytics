<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3eee2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d2723" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="気圧">
<title>気圧・体調アラーム ウィジェット</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    color-scheme: light;
    --bg:        #f3eee2;    /* クリーム（参考画像の左パネル） */
    --card:      #fdfbf6;
    --ink:       #16302c;    /* ディープティール */
    --ink-soft:  #556b66;
    --ink-faint: #93a49f;
    --rule:      #e6dfcf;
    --band:      rgba(22,48,44,.075);
    --tile:      #efe9db;
    --shadow:
      0 1px 2px rgba(22,48,44,.05),
      0 6px 16px rgba(22,48,44,.06),
      0 16px 40px rgba(22,48,44,.05);
    --good:      #0b8f4a;
    --warning:   #c07f07;
    --serious:   #d9663a;
    --critical:  #c62f2f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:        #0d2723;   /* 参考画像の右パネル */
      --card:      #143631;
      --ink:       #f3eee2;
      --ink-soft:  #a6bcb6;
      --ink-faint: #6d8781;
      --rule:      #1f4741;
      --band:      rgba(243,238,226,.085);
      --tile:      #0e2c27;
      --shadow:
        0 1px 2px rgba(0,0,0,.30),
        0 6px 18px rgba(0,0,0,.28),
        0 18px 44px rgba(0,0,0,.22);
      --good:      #45c07a;
      --warning:   #e0aa32;
      --serious:   #ef8f63;
      --critical:  #f2706e;
    }
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    max-width: 420px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 22px) 18px
             calc(env(safe-area-inset-bottom) + 26px);
  }

  /* ---------- card ---------- */
  .card{
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-top: 14px;
  }
  .card:first-of-type{ margin-top: 16px; }

  /* ---------- place ---------- */
  .place{
    display:block;
    width:100%;
    background:none; border:none; padding:0; margin:0;
    font: inherit;
    text-align:center;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  /* ---------- hero: flip digits ---------- */
  .sr-only{
    position:absolute; width:1px; height:1px;
    margin:-1px; padding:0; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  .hero-card{ padding: 20px 16px 16px; }
  .flips{
    display:flex;
    justify-content:center;
    gap: 5px;
  }
  /* 1枚の札。上下の半分に分かれ、その隙間が継ぎ目になる。 */
  .fd{
    --fdH: min(132px, 31vw);
    position: relative;
    flex: 1 1 0;
    max-width: 82px;
    height: var(--fdH);
    perspective: 420px;
    font-size: min(104px, 24.5vw);
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--ink);
  }
  .fd-half, .fd-flap{
    position:absolute;
    left:0; right:0;
    height: calc(50% - 1px);   /* 上下の間に2pxの継ぎ目を残す */
    overflow:hidden;
    background: var(--tile);
    backface-visibility: hidden;
  }
  .fd-half > span, .fd-flap > span{
    position:absolute;
    left:0; width:100%;
    height: var(--fdH);
    line-height: var(--fdH);
    text-align:center;
  }
  .fd-top,  .fd-flap-top{ top:0;    border-radius: 9px 9px 2px 2px; }
  .fd-bot,  .fd-flap-bot{ bottom:0; border-radius: 2px 2px 9px 9px; }
  .fd-top > span,  .fd-flap-top > span{ top: 0; }
  .fd-bot > span,  .fd-flap-bot > span{ top: calc(var(--fdH) * -0.5); }

  .fd-flap{ z-index: 2; }
  .fd-flap-top{ transform-origin: bottom center; animation: fdFall 170ms ease-in forwards; }
  .fd-flap-bot{ transform-origin: top center;    transform: rotateX(90deg);
                animation: fdRise 170ms ease-out 170ms forwards; }
  @keyframes fdFall{ from{ transform: rotateX(0deg);  } to{ transform: rotateX(-90deg); } }
  @keyframes fdRise{ from{ transform: rotateX(90deg); } to{ transform: rotateX(0deg);   } }

  @media (prefers-reduced-motion: reduce){
    .fd-flap{ display:none; }
  }

  .hero-unit{
    display:block;
    text-align:center;
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }

  /* ---------- status ---------- */
  /* 判定とmax/minを同じベースラインに載せ、1行として釣り合わせる */
  .status-row{
    display:flex;
    align-items: baseline;
    justify-content:space-between;
    gap: 6px 12px;
    /* 狭い画面では語を折らず、max/minごと次の行に落とす */
    flex-wrap: wrap;
  }
  .minmax{
    display:flex;
    align-items: baseline;
    gap: 15px;
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  .minmax > span{
    display:inline-flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .minmax .k{
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  .minmax .t{
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .minmax .t .u{ font-size: 11px; color: var(--ink-faint); margin-left: 1px; }
  .status[data-level="good"]     { --tone: var(--good); }
  .status[data-level="warning"]  { --tone: var(--warning); }
  .status[data-level="serious"]  { --tone: var(--serious); }
  .status[data-level="critical"] { --tone: var(--critical); }
  .status-word{
    font-size: 17px;
    font-weight: 500;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .status-word::before{
    content:"";
    display:inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--tone);
    margin-right: 8px;
    vertical-align: 2px;
  }
  .status-note{
    margin-top: 9px;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .status-note:empty{ display:none; }

  /* ---------- care ---------- */
  .care-label{
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--ink-faint);
    text-transform: uppercase;
    text-align:center;
  }
  .care ul{
    list-style:none;
    margin: 14px 0 0;
    padding: 0;
  }
  .care li{
    display:flex;
    gap: 12px;
    align-items:baseline;
    padding: 11px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .care li:first-child{ border-top: 1px solid var(--rule); }
  .care li:last-child{ border-bottom: none; padding-bottom: 2px; }
  .care li .n{
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    flex: none;
    width: 1.1em;
  }
  .care li .why{
    display:block;
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 3px;
    line-height: 1.5;
  }

  /* ---------- forecast strip ---------- */
  .strip{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    font-variant-numeric: tabular-nums;
  }
  .strip div{ text-align:center; }
  .strip .h{
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: .04em;
  }
  .strip .v{
    font-size: 15px;
    font-weight: 600;
    margin-top: 7px;
    letter-spacing: -0.02em;
  }
  .strip .now .h{ color: var(--ink); }
  .strip .now .v{ color: var(--ink); font-weight: 800; }

  /* ---------- main plot ---------- */
  .plot{
    margin-top: 22px;
    touch-action: pan-y;
  }
  .plot svg{ display:block; width:100%; height:auto; overflow:visible; }
  .plot-foot{
    display:flex;
    justify-content:space-between;
    margin-top: 7px;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
  }
  .plot-foot .mid{ color: var(--ink-soft); }
  .plot-note{
    margin-top: 10px;
    font-size: 11px;
    color: var(--ink-faint);
    line-height: 1.5;
    display:flex;
    align-items:center;
    gap: 7px;
  }
  .plot-note:empty{ display:none; }
  .plot-note::before{
    content:"";
    flex: none;
    width: 16px; height: 10px;
    border-radius: 2px;
    background: var(--band);
    box-shadow: inset 0 0 0 1px var(--rule);
  }

  /* ---------- metric rows ---------- */
  .row{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 15px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row:first-child{ padding-top: 2px; }
  .row:last-child{ border-bottom: none; padding-bottom: 2px; }
  .row-label{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: .1em;
    width: 3.2em;
    flex: none;
  }
  .row-spark{ flex: 1; min-width: 0; touch-action: pan-y; }
  .row-spark svg{ display:block; width:100%; height:auto; }
  .row-value{
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: right;
    width: 4.4em;
    flex: none;
    letter-spacing: -0.02em;
  }
  .row-value .u{ font-size: 11px; color: var(--ink-faint); margin-left: 1px; }

  /* ---------- foot ---------- */
  .foot-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 16px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: .06em;
  }
  .foot-row button{
    background:none; border:none; padding:0; margin:0;
    font: inherit; color: var(--ink-soft); letter-spacing:.06em;
  }
  .foot-row .t{ font-variant-numeric: tabular-nums; color: var(--ink-faint); }

  .msg{
    font-size: 11.5px;
    color: var(--ink-faint);
    line-height:1.55;
    margin-top: 12px;
  }
  .msg:empty{ display:none; }

  /* ---------- search ---------- */
  .search{ margin-top: 22px; }
  .search.hidden{ display:none; }
  .search input{
    width:100%;
    border:none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    padding: 10px 0;
    font-size: 16px;
    font-family: inherit;
    text-align:center;
    letter-spacing: .04em;
  }
  .search input:focus{ outline:none; border-bottom-color: var(--ink-soft); }
  .search ul{ list-style:none; margin: 2px 0 0; padding:0; }
  .search li{
    padding: 13px 0;
    font-size: 14px;
    text-align:center;
    border-bottom: 1px solid var(--rule);
    letter-spacing: .04em;
  }
  .search li:active{ color: var(--ink-soft); }
  .search li.empty{ color: var(--ink-faint); border:none; }

  /* ---------- note ---------- */
  details.note{ margin-top: 24px; }
  details.note summary{
    list-style:none;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  details.note summary::-webkit-details-marker{ display:none; }
  details.note p{
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink-faint);
    margin: 12px 0 0;
  }
  details.note a{ color: var(--ink-soft); }
</style>
</head>
<body>
<div class="app">

  <button class="place" id="placeBtn" type="button"><span id="placeName">…</span></button>

  <div class="card hero-card">
    <div class="flips" id="flips" aria-hidden="true"></div>
    <div class="sr-only" id="heroValue">--</div>
    <div class="hero-unit">hPa</div>
  </div>

  <div class="card">
    <div class="status" id="status" data-level="good">
      <div class="status-row">
        <div class="status-word" id="statusWord">読み込み中</div>
        <div class="minmax">
          <span><span class="k">max</span><span class="t"><span id="tMax">--</span><span class="u">°</span></span></span>
          <span><span class="k">min</span><span class="t"><span id="tMin">--</span><span class="u">°</span></span></span>
        </div>
      </div>
      <div class="status-note" id="statusNote"></div>
    </div>
  </div>

  <div class="card">
    <div class="strip" id="strip"></div>
    <div class="plot" id="plot">
      <svg id="chartPressure" viewBox="0 0 320 104" preserveAspectRatio="none"
           role="img" aria-label="気圧の推移"></svg>
      <div class="plot-foot">
        <span>12時間前</span>
        <span class="mid" id="plotMid">現在</span>
        <span>12時間後</span>
      </div>
      <div class="plot-note" id="plotNote"></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="row-label">気温</div>
      <div class="row-spark"><svg id="chartTemp" viewBox="0 0 160 26" preserveAspectRatio="none"
        role="img" aria-label="気温の推移"></svg></div>
      <div class="row-value"><span id="tempValue">--</span><span class="u">°C</span></div>
    </div>
    <div class="row">
      <div class="row-label">湿度</div>
      <div class="row-spark"><svg id="chartHumidity" viewBox="0 0 160 26" preserveAspectRatio="none"
        role="img" aria-label="湿度の推移"></svg></div>
      <div class="row-value"><span id="humidityValue">--</span><span class="u">%</span></div>
    </div>
  </div>

  <div class="card care" id="care">
    <div class="care-label" id="careLabel">できること</div>
    <ul id="careList"></ul>
  </div>

  <div class="foot-row">
    <button id="refreshBtn" type="button">更新</button>
    <span class="t" id="footTime"></span>
  </div>

  <div class="msg" id="msg"></div>

  <div class="search hidden" id="search">
    <input type="text" id="geoInput" placeholder="地名で検索" autocomplete="off"
           autocorrect="off" spellcheck="false" enterkeyhint="search">
    <ul id="geoResults"></ul>
  </div>

  <details class="note">
    <summary>体調の目安について</summary>
    <p>気圧・気温・湿度の変化にもとづく一般的な目安です。医学的な診断ではありません。体調がすぐれないときは無理をせず、症状が続く場合は医療機関にご相談ください。</p>
    <p>気象データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
    <p>表示中のバージョン: <span id="buildId">-</span></p>
  </details>

</div>

<script>
(function(){
  "use strict";

  // 画面が更新されたかを端末側で確かめられるようにする。
  var BUILD = "v12";
  var WINDOW_H   = 12;              // グラフに映す前後の時間
  var REFRESH_MS = 15 * 60 * 1000;
  var STALE_MS   = 3 * 60 * 60 * 1000;
  var LOCATION_KEY = "wxwidget.location.v2";
  var CACHE_KEY    = "wxwidget.cache.v2";

  var $ = function(id){ return document.getElementById(id); };
  var els = {
    placeBtn:$("placeBtn"), placeName:$("placeName"),
    heroValue:$("heroValue"), flips:$("flips"),
    status:$("status"), statusWord:$("statusWord"), statusNote:$("statusNote"),
    tMax:$("tMax"), tMin:$("tMin"),
    careLabel:$("careLabel"), careList:$("careList"),
    strip:$("strip"),
    plot:$("plot"), chartPressure:$("chartPressure"), plotMid:$("plotMid"),
    plotNote:$("plotNote"),
    tempValue:$("tempValue"), humidityValue:$("humidityValue"),
    chartTemp:$("chartTemp"), chartHumidity:$("chartHumidity"),
    refreshBtn:$("refreshBtn"), footTime:$("footTime"),
    search:$("search"), geoInput:$("geoInput"), geoResults:$("geoResults"),
    msg:$("msg")
  };

  function setMsg(t){ els.msg.textContent = t || ""; }

  // ---------- storage ----------

  function readJSON(k){
    try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; }
  }
  function writeJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function loadPref(){ return readJSON(LOCATION_KEY) || { mode:"auto" }; }
  function savePref(p){ writeJSON(LOCATION_KEY, p); }

  // ---------- geolocation ----------

  // getCurrentPosition の timeout は許可が下りてから数え始める仕様のため、
  // 許可プロンプトが放置されると永久に返らない。実時間で打ち切る。
  function withDeadline(promise, ms){
    return new Promise(function(resolve, reject){
      var settled = false;
      var timer = setTimeout(function(){
        if(!settled){ settled = true; reject(new Error("deadline")); }
      }, ms);
      promise.then(function(v){
        if(!settled){ settled = true; clearTimeout(timer); resolve(v); }
      }, function(e){
        if(!settled){ settled = true; clearTimeout(timer); reject(e); }
      });
    });
  }

  function getCurrentPosition(){
    return withDeadline(new Promise(function(resolve, reject){
      if(!("geolocation" in navigator)){ reject(new Error("unsupported")); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({ lat:pos.coords.latitude, lon:pos.coords.longitude }); },
        reject,
        { enableHighAccuracy:false, timeout:10000, maximumAge:60000 }
      );
    }), 12000);
  }

  function reverseName(lat, lon){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?latitude=" + lat +
      "&longitude=" + lon + "&count=1&language=ja&format=json")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.results && j.results[0] && j.results[0].name) || "現在地"; })
      .catch(function(){ return "現在地"; });
  }

  function geocodeSearch(q){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(q) + "&count=5&language=ja&format=json")
      .then(function(r){ if(!r.ok) throw new Error("geocode"); return r.json(); })
      .then(function(j){ return j.results || []; });
  }

  // ---------- weather ----------

  // hourly は毎時ちょうど、current.time は分を含むため両者は一致しない。
  // 観測地点の現地時刻から「今の時間帯」を直接求める。
  function computeNowIndex(times, utcOffsetSeconds){
    var localNow = new Date(Date.now() + (utcOffsetSeconds || 0) * 1000);
    var key = localNow.toISOString().slice(0, 13);
    for(var i = 0; i < times.length; i++){
      if(times[i].slice(0, 13) === key) return i;
    }
    var best = 0;
    for(var j = 0; j < times.length; j++){
      if(times[j].slice(0, 13) <= key) best = j; else break;
    }
    return best;
  }

  function fetchWeather(lat, lon){
    return fetch("https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + encodeURIComponent(lat) +
      "&longitude=" + encodeURIComponent(lon) +
      "&hourly=temperature_2m,relative_humidity_2m,pressure_msl" +
      "&past_days=1&forecast_days=2&timezone=auto", { cache:"no-store" }
    ).then(function(res){
      if(!res.ok) throw new Error("forecast-" + res.status);
      return res.json();
    }).then(function(json){
      var times = json.hourly.time;
      return {
        times: times,
        pressure: json.hourly.pressure_msl,
        temp: json.hourly.temperature_2m,
        humidity: json.hourly.relative_humidity_2m,
        nowIndex: computeNowIndex(times, json.utc_offset_seconds),
        utcOffset: json.utc_offset_seconds || 0
      };
    });
  }

  // ---------- alarm ----------

  var THRESH = {
    warning:  { past3:-2, past6:-3, future6:-3 },
    serious:  { past3:-4, past6:-6, future6:-5 },
    critical: { past3:-6, past6:-9, future6:-8 }
  };
  var ORDER = { good:0, warning:1, serious:2, critical:3 };
  var WORD  = { good:"問題なし", warning:"注意", serious:"警戒", critical:"厳重警戒" };

  function back(a,i,n){ var j=i-n; if(j<0||i>=a.length||a[j]==null||a[i]==null) return null; return a[i]-a[j]; }
  function ahead(a,i,n){ var j=i+n; if(j>=a.length||a[j]==null||a[i]==null) return null; return a[j]-a[i]; }
  function levelFor(d,k){
    if(d==null) return "good";
    if(d<=THRESH.critical[k]) return "critical";
    if(d<=THRESH.serious[k])  return "serious";
    if(d<=THRESH.warning[k])  return "warning";
    return "good";
  }

  function computeAlarm(d){
    var p=d.pressure, i=d.nowIndex;
    var d3=back(p,i,3), d6=back(p,i,6), f6=ahead(p,i,6);
    var lv=[levelFor(d3,"past3"), levelFor(d6,"past6"), levelFor(f6,"future6")];
    var level="good";
    lv.forEach(function(l){ if(ORDER[l]>ORDER[level]) level=l; });

    var note="";
    if(level!=="good"){
      // 「低下」で向きは伝わるので数値の符号は外す
      var c=[];
      if(d3!=null&&ORDER[lv[0]]>0) c.push({v:d3,t:"3時間で"+Math.abs(d3).toFixed(1)+"hPa低下"});
      if(d6!=null&&ORDER[lv[1]]>0) c.push({v:d6,t:"6時間で"+Math.abs(d6).toFixed(1)+"hPa低下"});
      if(f6!=null&&ORDER[lv[2]]>0) c.push({v:f6,t:"この先6時間で"+Math.abs(f6).toFixed(1)+"hPa低下の予報"});
      c.sort(function(a,b){ return a.v-b.v; });
      if(c.length) note=c[0].t;
    }
    return { level:level, word:WORD[level], note:note };
  }

  // ---------- self-care ----------
  // 判定レベルごとの、その場でできる一般的なセルフケア。
  // いずれも薬に頼らない範囲にとどめ、受診の判断は注記側に委ねる。
  var CARE = {
    good: [
      { t:"こまめに水分をとる", w:"脱水は頭痛の引き金になりやすい" },
      { t:"睡眠の時間帯を一定に保つ", w:"自律神経の乱れを防ぐ" }
    ],
    warning: [
      { t:"水分をとる", w:"温かい飲み物だと体が冷えにくい" },
      { t:"首と肩をゆっくり回す", w:"こわばりが頭痛につながりやすい" },
      { t:"カフェインとアルコールは控えめに", w:"利尿で水分が失われる" }
    ],
    serious: [
      { t:"耳を軽くつまんで、ゆっくり回す", w:"耳まわりの血流をうながす。1回1分ほど" },
      { t:"4秒吸って8秒吐く呼吸を数回", w:"息を長く吐くと体がゆるみやすい" },
      { t:"温かい飲み物で水分をとる", w:"冷えると症状が強く出やすい" },
      { t:"予定を詰め込まない", w:"低下が続く間は余裕をもって" }
    ],
    critical: [
      { t:"横になれる場所で休む", w:"暗く静かな場所だとなお良い" },
      { t:"耳と首の後ろを温める", w:"蒸しタオルや手のひらで十分" },
      { t:"4秒吸って8秒吐く呼吸を数回", w:"息を長く吐くと体がゆるみやすい" },
      { t:"激しい運動と長時間の外出は避ける", w:"回復を優先する" }
    ]
  };

  function renderCare(level){
    var items = CARE[level] || CARE.good;
    els.careLabel.textContent = (level === "good") ? "整えておくこと" : "いまできること";
    els.careList.innerHTML = "";
    items.forEach(function(it, i){
      var li = document.createElement("li");
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = (i + 1);
      var body = document.createElement("div");
      body.appendChild(document.createTextNode(it.t));
      var why = document.createElement("span");
      why.className = "why";
      why.textContent = it.w;
      body.appendChild(why);
      li.appendChild(n); li.appendChild(body);
      els.careList.appendChild(li);
    });
  }

  // ---------- format ----------

  function describeAge(ms){
    var min=Math.floor((Date.now()-ms)/60000);
    if(min<1) return "たった今";
    if(min<60) return min+"分前";
    var h=Math.floor(min/60);
    if(h<24) return h+"時間前";
    return Math.floor(h/24)+"日前";
  }
  function hhmm(iso){ return iso.slice(11,16); }
  function hourOf(iso){ return iso.slice(11,13); }
  function localClock(off){ return new Date(Date.now()+(off||0)*1000).toISOString().slice(11,16); }

  // ---------- svg ----------

  // グラフは全期間ではなく現在の前後 WINDOW_H 時間だけを映す。
  function win(){
    var d=state.data;
    return {
      s: Math.max(0, d.nowIndex - WINDOW_H),
      e: Math.min(d.times.length - 1, d.nowIndex + WINDOW_H)
    };
  }

  var NS="http://www.w3.org/2000/svg";
  function mk(tag,a){ var n=document.createElementNS(NS,tag); for(var k in a) n.setAttribute(k,a[k]); return n; }
  function clear(s){ while(s.firstChild) s.removeChild(s.firstChild); }
  function scaleOf(vals,minSpan){
    var v=vals.filter(function(x){ return x!=null; });
    if(!v.length) return null;
    var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v), span=hi-lo;
    if(span<minSpan){ var pad=(minSpan-span)/2; lo-=pad; hi+=pad; }
    else { var e=span*0.15; lo-=e; hi+=e; }
    return {lo:lo,hi:hi};
  }
  function pathOf(pts){
    return pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join("");
  }

  // 主グラフ。塗りも目盛りも置かず、線一本と現在位置だけで読ませる。
  // 3時間あたりの下がり幅が注意水準（-2hPa）に達する区間を洗い出す。
  // 連続する区間はひと続きにまとめる。
  function cautionBands(p){
    var bands=[], cur=null;
    for(var i=0; i+3 < p.length; i++){
      if(p[i]==null || p[i+3]==null){ continue; }
      var drop = p[i+3] - p[i];
      if(drop <= THRESH.warning.past3){
        if(cur) cur.e = i+3;
        else cur = { s:i, e:i+3 };
      }else if(cur){
        bands.push(cur); cur = null;
      }
    }
    if(cur) bands.push(cur);
    return bands;
  }

  function drawMain(svg, d, focus){
    clear(svg);
    var v=d.pressure, now=d.nowIndex, W=320, H=104, top=10, bot=8;
    var w=win(), span=w.e-w.s;
    var sc=scaleOf(v.slice(w.s, w.e+1), 6); if(!sc || span<1) return;
    var ph=H-top-bot;
    function X(i){ return ((i-w.s)/span)*W; }
    function Y(x){ return top+(1-(x-sc.lo)/(sc.hi-sc.lo))*ph; }

    // 要注意の時間帯を先に敷く。判定は全期間で行い、映す範囲に切り詰める。
    cautionBands(v).forEach(function(b){
      var s=Math.max(b.s, w.s), e=Math.min(b.e, w.e);
      if(e<=s) return;
      svg.appendChild(mk("rect",{
        x:X(s), y:0, width:Math.max(X(e)-X(s), 1), height:H,
        fill:"var(--band)"
      }));
    });

    var past=[], future=[];
    for(var i=w.s;i<=w.e;i++){
      if(v[i]==null) continue;
      var pt=[X(i),Y(v[i])];
      if(i<=now) past.push(pt);
      if(i>=now) future.push(pt);
    }
    if(past.length>1){
      svg.appendChild(mk("path",{ d:pathOf(past), fill:"none", stroke:"var(--ink)",
        "stroke-width":2.6, "stroke-linejoin":"round", "stroke-linecap":"round" }));
    }
    if(future.length>1){
      svg.appendChild(mk("path",{ d:pathOf(future), fill:"none", stroke:"var(--ink)",
        "stroke-width":2.6, opacity:.42, "stroke-linejoin":"round",
        "stroke-linecap":"round", "stroke-dasharray":"1 4.4" }));
    }
    var at = (focus==null) ? now : focus;
    if(v[at]!=null && at>=w.s && at<=w.e){
      var cx=X(at), cy=Y(v[at]);
      svg.appendChild(mk("line",{ x1:cx, x2:cx, y1:0, y2:H,
        stroke:"var(--rule)", "stroke-width":1.4 }));
      svg.appendChild(mk("circle",{ cx:cx, cy:cy, r:5.4, fill:"var(--card)" }));
      svg.appendChild(mk("circle",{ cx:cx, cy:cy, r:3.4, fill:"var(--ink)" }));
    }
  }

  function drawSpark(svg, vals, now, focus){
    clear(svg);
    var W=160,H=26,pad=3.5;
    var w=win(), span=w.e-w.s;
    var sc=scaleOf(vals.slice(w.s, w.e+1), 4); if(!sc || span<1) return;
    function X(i){ return ((i-w.s)/span)*W; }
    function Y(x){ return pad+(1-(x-sc.lo)/(sc.hi-sc.lo))*(H-pad*2); }
    var past=[],future=[];
    for(var i=w.s;i<=w.e;i++){
      if(vals[i]==null) continue;
      var pt=[X(i),Y(vals[i])];
      if(i<=now) past.push(pt);
      if(i>=now) future.push(pt);
    }
    if(past.length>1) svg.appendChild(mk("path",{ d:pathOf(past), fill:"none",
      stroke:"var(--ink)", "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round" }));
    if(future.length>1) svg.appendChild(mk("path",{ d:pathOf(future), fill:"none",
      stroke:"var(--ink)", "stroke-width":2, opacity:.4, "stroke-linejoin":"round",
      "stroke-linecap":"round", "stroke-dasharray":"1 3.4" }));

    // 気圧のグラフをなぞったとき、気温・湿度の印も同じ時刻へ移す。
    var at = (focus==null) ? now : focus;
    if(vals[at]!=null && at>=w.s && at<=w.e){
      if(focus!=null){
        svg.appendChild(mk("line",{ x1:X(at), x2:X(at), y1:0, y2:H,
          stroke:"var(--rule)", "stroke-width":1.4 }));
      }
      svg.appendChild(mk("circle",{ cx:X(at), cy:Y(vals[at]), r:4, fill:"var(--card)" }));
      svg.appendChild(mk("circle",{ cx:X(at), cy:Y(vals[at]), r:2.4, fill:"var(--ink)" }));
    }
  }

  // ---------- render ----------

  var state = { data:null, fetchedAt:0, place:"", scrub:null };

  // ---------- flip digits ----------

  function makeTile(ch){
    var fd = document.createElement("div");
    fd.className = "fd";
    fd.setAttribute("data-v", ch);
    ["fd-top","fd-bot"].forEach(function(cls){
      var half = document.createElement("div");
      half.className = "fd-half " + cls;
      var sp = document.createElement("span");
      sp.textContent = ch;
      half.appendChild(sp);
      fd.appendChild(half);
    });
    return fd;
  }

  function halfWith(cls, ch){
    var el = document.createElement("div");
    el.className = "fd-flap " + cls;
    var sp = document.createElement("span");
    sp.textContent = ch;
    el.appendChild(sp);
    return el;
  }

  // 上半分が新しい数字に替わったところへ、古い数字の板が倒れ、
  // 続いて新しい数字の下半分が起き上がる。
  function flipTile(fd, next){
    var prev = fd.getAttribute("data-v");
    if(prev === next) return;
    fd.setAttribute("data-v", next);

    var top = fd.querySelector(".fd-top > span");
    var bot = fd.querySelector(".fd-bot > span");

    // 途中の札が残っていれば片付ける（連続更新への備え）
    var stale = fd.querySelectorAll(".fd-flap");
    for(var k=0;k<stale.length;k++) fd.removeChild(stale[k]);

    top.textContent = next;          // 倒れる板の裏から現れる
    // bot は倒れ終わるまで古い数字のまま残す

    var flapTop = halfWith("fd-flap-top", prev);
    var flapBot = halfWith("fd-flap-bot", next);
    fd.appendChild(flapTop);
    fd.appendChild(flapBot);

    flapBot.addEventListener("animationend", function(){
      bot.textContent = next;
      if(flapTop.parentNode) fd.removeChild(flapTop);
      if(flapBot.parentNode) fd.removeChild(flapBot);
    });
  }

  function setTile(fd, ch){
    fd.setAttribute("data-v", ch);
    fd.querySelector(".fd-top > span").textContent = ch;
    fd.querySelector(".fd-bot > span").textContent = ch;
    var stale = fd.querySelectorAll(".fd-flap");
    for(var k=0;k<stale.length;k++) fd.removeChild(stale[k]);
  }

  var reduceMotion = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function renderFlips(text, animate){
    var chars = String(text).split("");
    var tiles = els.flips.children;

    // 桁数が変わったら組み直す（このときは動かさない）
    if(tiles.length !== chars.length){
      els.flips.innerHTML = "";
      chars.forEach(function(ch){ els.flips.appendChild(makeTile(ch)); });
      return;
    }
    chars.forEach(function(ch, i){
      var fd = tiles[i];
      if(animate && !reduceMotion) flipTile(fd, ch);
      else if(fd.getAttribute("data-v") !== ch) setTile(fd, ch);
    });
  }

  function renderHero(animate){
    var d=state.data; if(!d) return;
    var i = (state.scrub==null) ? d.nowIndex : state.scrub;
    var shown = d.pressure[i]==null ? "--" : String(Math.round(d.pressure[i]));
    els.heroValue.textContent = shown;
    // なぞっている間は値が連続で変わるため、めくらずに差し替える
    renderFlips(shown, animate === true && state.scrub == null);
    els.tempValue.textContent = d.temp[i]==null ? "--" : d.temp[i].toFixed(1);
    els.humidityValue.textContent = d.humidity[i]==null ? "--" : Math.round(d.humidity[i]);
    els.plotMid.textContent = (state.scrub==null)
      ? "現在"
      : hhmm(d.times[i]) + (i<d.nowIndex ? "・過去" : (i>d.nowIndex ? "・予報" : "・現在"));
  }

  // その地点の「今日」の最高・最低気温。時刻は現地時刻で並んでいる。
  function renderMinMax(){
    var d=state.data; if(!d) return;
    var today = new Date(Date.now() + (d.utcOffset||0)*1000).toISOString().slice(0,10);
    var hi=null, lo=null;
    for(var i=0;i<d.times.length;i++){
      if(d.times[i].slice(0,10) !== today) continue;
      var t=d.temp[i];
      if(t==null) continue;
      if(hi==null || t>hi) hi=t;
      if(lo==null || t<lo) lo=t;
    }
    els.tMax.textContent = hi==null ? "--" : hi.toFixed(1);
    els.tMin.textContent = lo==null ? "--" : lo.toFixed(1);
  }

  function renderStatus(){
    var d=state.data; if(!d) return;
    var a=computeAlarm(d);
    els.status.setAttribute("data-level", a.level);
    els.statusWord.textContent = a.word;
    els.statusNote.textContent = (Date.now()-state.fetchedAt > STALE_MS)
      ? describeAge(state.fetchedAt)+"のデータです。更新してください。"
      : a.note;
    renderCare(a.level);
  }

  // 3時間ごとの気圧予報。Weat の時刻ストリップにあたる部分。
  // 絶対値を整数で並べると、このアプリが見たい数hPaの変化が丸めで消えるため、
  // 先頭だけ実測値、以降は「今からの変化」を符号つきで示す。
  function renderStrip(){
    var d=state.data; if(!d) return;
    var base = d.pressure[d.nowIndex];
    els.strip.innerHTML="";
    for(var k=0;k<5;k++){      // 今 / +3 / +6 / +9 / +12 時間。グラフの右端に合わせる
      var i=d.nowIndex+k*3;
      if(i>=d.times.length) break;
      var cell=document.createElement("div");
      if(k===0) cell.className="now";

      var h=document.createElement("div");
      h.className="h";
      h.textContent = (k===0) ? "今" : hourOf(d.times[i])+"時";

      var v=document.createElement("div");
      v.className="v";
      if(d.pressure[i]==null || base==null){
        v.textContent = "--";
      }else if(k===0){
        v.textContent = Math.round(base);
      }else{
        var diff = d.pressure[i] - base;
        var r = Math.abs(diff) < 0.05 ? 0 : diff;   // -0.0 を出さない
        v.textContent = (r > 0 ? "+" : (r < 0 ? "-" : "±")) + Math.abs(r).toFixed(1);
      }
      cell.appendChild(h); cell.appendChild(v);
      els.strip.appendChild(cell);
    }
  }

  // 要注意の時間帯があるときだけ、帯の意味を書き添える。
  function renderPlotNote(){
    var d=state.data; if(!d) return;
    var w=win();
    var visible = cautionBands(d.pressure).some(function(b){
      return Math.min(b.e, w.e) > Math.max(b.s, w.s);
    });
    els.plotNote.textContent = visible ? "気圧が下がりやすい時間帯" : "";
  }

  function drawCharts(focus){
    var d=state.data; if(!d) return;
    drawMain(els.chartPressure, d, focus);
    drawSpark(els.chartTemp, d.temp, d.nowIndex, focus);
    drawSpark(els.chartHumidity, d.humidity, d.nowIndex, focus);
  }

  function renderAll(animate){
    var d=state.data; if(!d) return;
    renderHero(animate);
    renderStatus();
    renderMinMax();
    renderStrip();
    renderPlotNote();
    drawCharts(state.scrub);
    els.footTime.textContent = localClock(d.utcOffset);
  }

  // ---------- scrub ----------

  // なぞる対象はどのグラフでもよい。時間軸はすべて共通なので、
  // 触れている要素の幅を基準に位置を求める。
  var scrubbing=false, scrubEl=null;

  function indexFromX(clientX){
    var d=state.data; if(!d || !scrubEl) return null;
    var r=scrubEl.getBoundingClientRect();
    if(!r.width) return null;
    var t=Math.max(0, Math.min(1, (clientX-r.left)/r.width));
    var w=win();
    return w.s + Math.round(t*(w.e-w.s));
  }
  function sStart(e){
    if(!state.data) return;
    scrubEl = e.currentTarget.querySelector("svg") || e.currentTarget;
    scrubbing=true;
    sMove(e);
  }
  function sMove(e){
    if(!scrubbing||!state.data) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var i = indexFromX(x);
    if(i==null||i===state.scrub) return;
    state.scrub=i;
    renderHero();
    drawCharts(i);
  }
  function sEnd(){
    if(!scrubbing) return;
    scrubbing=false; scrubEl=null; state.scrub=null;
    renderHero();
    if(state.data) drawCharts(null);
  }

  [els.plot, els.chartTemp.parentNode, els.chartHumidity.parentNode].forEach(function(el){
    el.addEventListener("touchstart", sStart, {passive:true});
    el.addEventListener("touchmove",  sMove,  {passive:true});
    el.addEventListener("touchend",   sEnd);
    el.addEventListener("touchcancel",sEnd);
    el.addEventListener("mousedown",  sStart);
  });
  window.addEventListener("mousemove", sMove);
  window.addEventListener("mouseup",   sEnd);

  // ---------- data flow ----------

  var busy=false;
  function setBusy(on){
    busy=on;
    els.refreshBtn.textContent = on ? "更新中" : "更新";
  }

  function applyCache(){
    var c=readJSON(CACHE_KEY);
    if(!c||!c.data) return false;
    state.data=c.data; state.fetchedAt=c.fetchedAt; state.place=c.place;
    els.placeName.textContent=c.place;
    renderAll(false);
    return true;
  }

  function load(place, lat, lon){
    setBusy(true); setMsg("");
    return fetchWeather(lat, lon).then(function(data){
      state.data=data; state.fetchedAt=Date.now(); state.place=place; state.scrub=null;
      els.placeName.textContent=place;
      writeJSON(CACHE_KEY,{place:place,lat:lat,lon:lon,data:data,fetchedAt:Date.now()});
      renderAll(true); setBusy(false);
    }).catch(function(err){
      setBusy(false); console.error(err);
      var had = state.data!=null;
      setMsg(had ? "更新できませんでした。表示は"+describeAge(state.fetchedAt)+"のデータです。"
                 : "データを取得できませんでした。通信環境を確認してください。");
      if(had) renderStatus();
    });
  }

  // 起動・復帰のたびに呼ぶ。auto なら現在地を取り直してから読み込む。
  function start(){
    if(busy) return Promise.resolve();
    var pref=loadPref();
    if(pref.mode==="manual") return load(pref.name, pref.lat, pref.lon);

    setBusy(true);
    return getCurrentPosition().then(function(pos){
      setBusy(false);
      var c=readJSON(CACHE_KEY);
      var moved = !c || c.place==null ||
        Math.abs((c.lat||0)-pos.lat)>0.05 || Math.abs((c.lon||0)-pos.lon)>0.05;
      if(!moved) return load(c.place, pos.lat, pos.lon);
      return reverseName(pos.lat,pos.lon).then(function(name){
        return load(name, pos.lat, pos.lon);
      });
    }).catch(function(){
      setBusy(false);
      var c=readJSON(CACHE_KEY);
      if(c && c.lat!=null){
        setMsg("現在地を取得できないため、前回の地点を表示しています。");
        return load(c.place, c.lat, c.lon);
      }
      setMsg("現在地を取得できません。地名で検索してください。");
      openSearch();
    });
  }

  // ---------- search ----------

  function openSearch(){ els.search.classList.remove("hidden"); els.geoInput.focus(); }
  function closeSearch(){
    els.search.classList.add("hidden");
    els.geoResults.innerHTML=""; els.geoInput.value="";
  }
  els.placeBtn.addEventListener("click", function(){
    if(els.search.classList.contains("hidden")) openSearch(); else closeSearch();
  });

  var timer=null;
  els.geoInput.addEventListener("input", function(){
    clearTimeout(timer);
    var q=els.geoInput.value.trim();
    if(!q){ els.geoResults.innerHTML=""; return; }
    timer=setTimeout(function(){ runSearch(q); }, 300);
  });
  function runSearch(q){
    geocodeSearch(q).then(function(rs){
      if(!rs.length){ els.geoResults.innerHTML='<li class="empty">見つかりません</li>'; return; }
      els.geoResults.innerHTML="";
      rs.forEach(function(r){
        var li=document.createElement("li");
        li.textContent=[r.name,r.admin1].filter(Boolean).join("、");
        li.addEventListener("click", function(){
          savePref({mode:"manual",name:r.name,lat:r.latitude,lon:r.longitude});
          closeSearch();
          load(r.name,r.latitude,r.longitude);
        });
        els.geoResults.appendChild(li);
      });
    }).catch(function(){
      els.geoResults.innerHTML='<li class="empty">検索できません</li>';
    });
  }

  // 現在地に戻す導線: 更新の長押し
  var hold=null;
  els.refreshBtn.addEventListener("touchstart", function(){
    hold=setTimeout(function(){
      savePref({mode:"auto"});
      setMsg("現在地に戻しました。");
      start();
    }, 600);
  }, {passive:true});
  ["touchend","touchcancel","touchmove"].forEach(function(ev){
    els.refreshBtn.addEventListener(ev, function(){ clearTimeout(hold); });
  });
  els.refreshBtn.addEventListener("click", function(){ start(); });

  // ---------- lifecycle ----------

  // ホーム画面から起動したとき、アプリは再読み込みされず「復帰」することがある。
  // 復帰も起動と同じ扱いにして、必ず現在時刻・現在地を取り直す。
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible") start();
  });
  window.addEventListener("pageshow", function(e){ if(e.persisted) start(); });
  setInterval(function(){
    if(document.visibilityState==="visible") start();
  }, REFRESH_MS);

  var buildEl = document.getElementById("buildId");
  if(buildEl) buildEl.textContent = BUILD;

  applyCache();
  start();

  if("serviceWorker" in navigator && window.isSecureContext){
    // ホーム画面から起動したアプリは、再読み込みされず前回の画面のまま
    // 「再開」することがある。その状態では新しい版を配信しても画面が
    // 古いままになるので、入れ替わりを検知して一度だけ読み込み直す。
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloading) return;
      reloading = true;
      location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        // 復帰のたびに新しい版の有無を確かめる。これがないと、
        // 再開しかしない端末では更新の確認そのものが走らない。
        document.addEventListener("visibilitychange", function(){
          if(document.visibilityState === "visible") reg.update();
        });
        setInterval(function(){ reg.update(); }, REFRESH_MS);
        reg.update();
      }).catch(function(e){
        console.warn("sw registration failed", e);
      });
    });
  }
})();
</script>
</body>
</html>
