<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e5e5e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="気圧">
<title>気圧・体調アラーム ウィジェット</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* 参考画像の作法にならう。
     ・地は一色のべた塗り。カードも影も使わない。
     ・図はすべて一色の黒。差し色は赤の点ひとつだけ。
     ・言葉は、図で言えないことにだけ使う。
     ・一画面に収める。余りは目盛りの円が吸う。 */
  :root{
    color-scheme: light;
    --bg:        #e5e5e2;              /* べた塗りのライトグレー */
    --ink:       #131313;              /* ほぼ黒。図も文字もこれ一色 */
    --ink-soft:  rgba(19,19,19,.62);
    --ink-faint: rgba(19,19,19,.42);
    --rule:      rgba(19,19,19,.16);
    --band:      rgba(19,19,19,.085);  /* 要注意の時間帯 */
    --dim:       .17;                  /* 未点灯の目盛り */
    --accent:    #e02a1f;              /* 赤い点 */
    --knob:      #d0d0cb;              /* 更新ボタンの地 */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:        #141414;
      --ink:       #ececea;
      --ink-soft:  rgba(236,236,234,.62);
      --ink-faint: rgba(236,236,234,.40);
      --rule:      rgba(236,236,234,.18);
      --band:      rgba(236,236,234,.09);
      --dim:       .19;
      --accent:    #ff4d3d;
      --knob:      #2d2d2d;
    }
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;                  /* スクロールさせない */
  }
  /* 縦は画面のぶんだけ。伸び縮みは目盛りの円が引き受ける。 */
  .app{
    height: 100dvh;
    max-width: 420px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 20px
             calc(env(safe-area-inset-bottom) + 12px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sr-only{
    position:absolute; width:1px; height:1px;
    margin:-1px; padding:0; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  /* ---------- 体調の目盛り：横線で描いた円 ---------- */
  /* 下から点灯する。満ちるほど負荷が大きい。言葉は使わない。 */
  .risk{
    flex: 1 1 auto;
    min-height: 100px;
    max-height: 58vh;
    /* 左右の余白ぶんまで使って、画面いっぱいに近づける */
    margin: 0 -20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .risk svg{ display:block; width:100%; height:100%; }
  .rr{
    stroke: var(--ink);
    stroke-linecap: butt;
    opacity: var(--dim);
    transition: opacity .45s ease;
  }
  .rr.on{ opacity: 1; }
  @media (prefers-reduced-motion: reduce){
    .rr{ transition: none; }
  }

  /* ---------- 状態のひとこと ---------- */
  .status{
    flex: 1 1 auto;
    min-height: 0;
    display:flex;
    flex-direction: column;
    justify-content: flex-end;
    text-align:center;
  }
  .status-note{ margin-top: 12px; }
  .status-note{
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .status-note:empty{ display:none; }
  .minmax{
    display:flex;
    justify-content:center;
    align-items: baseline;
    gap: 16px;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .minmax .k{
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ink-faint);
    margin-right: 4px;
    text-transform: uppercase;
  }
  .minmax .u{ font-size: 10px; color: var(--ink-faint); }

  /* ---------- 3時間ごとの気圧 ---------- */
  /* 大きな数字をやめたので、いまの気圧はこの列の左端が受け持つ。 */
  .strip{
    flex:none;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    font-variant-numeric: tabular-nums;
    margin-top: 11px;
  }
  .strip div{ text-align:center; }
  .strip .h{ font-size: 10px; color: var(--ink-faint); letter-spacing: .04em; }
  .strip .v{ font-size: 16px; font-weight: 700; margin-top: 5px; letter-spacing: -0.02em; }
  .strip .now .h{ color: var(--ink); }
  .strip .now .v{ font-size: 21px; font-weight: 800; }

  /* ---------- 気圧のグラフ ---------- */
  .plot{ flex:none; margin-top: 10px; touch-action: pan-y; }
  .plot svg{ display:block; width:100%; height:auto; overflow:visible; }
  .plot-foot{
    display:flex;
    justify-content:space-between;
    margin-top: 7px;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
  }
  .plot-foot .mid{ color: var(--ink-soft); }
  .plot-note{
    margin-top: 8px;
    font-size: 10px;
    color: var(--ink-faint);
    display:flex;
    align-items:center;
    gap: 6px;
    min-height: 11px;
  }
  .plot-note:empty::before{ display:none; }
  .plot-note::before{
    content:"";
    flex: none;
    width: 14px; height: 9px;
    background: var(--band);
    box-shadow: inset 0 0 0 1px var(--rule);
  }

  /* ---------- 気温・湿度 ---------- */
  /* 単位そのものが見出しになるので、言葉は置かない。 */
  .rows{ flex:none; margin-top: 10px; border-top: 1px solid var(--rule); }
  .row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child{ border-bottom: none; }
  .row-value{
    font-size: 21px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    width: 3.6em;
    flex: none;
    letter-spacing: -0.03em;
  }
  .row-value .u{ font-size: 12px; font-weight: 700; color: var(--ink-faint); margin-left: 1px; }
  .row-spark{ flex: 1; min-width: 0; touch-action: pan-y; }
  .row-spark svg{ display:block; width:100%; height:auto; }

  /* ---------- 足もと：赤い点で更新、右の点で地名 ---------- */
  .foot-row{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    padding-top: 12px;
  }
  .dot{
    width: 48px; height: 48px;
    flex:none;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--knob);
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
  }
  .dot::before{
    content:"";
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
  }
  .dot:active{ transform: scale(.92); }
  .dot[aria-busy="true"]{ animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  @media (prefers-reduced-motion: reduce){
    .dot[aria-busy="true"]{ animation:none; opacity:.55; }
  }
  .glyph{
    width: 44px; height: 44px;
    flex:none;
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: none;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .glyph svg{ width: 19px; height: 19px; }
  .glyph:active{ background: var(--band); }
  .foot-row .t{
    flex: 1;
    text-align:center;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }

  .msg{
    flex:none;
    font-size: 11px;
    color: var(--ink-faint);
    line-height:1.5;
    margin-top: 8px;
    max-height: 3em;
    overflow: hidden;
  }
  .msg:empty{ display:none; }

  /* ---------- 地名の検索・ことわり：どちらも別の面として開く ---------- */
  /* 本体を一画面に収めたいので、開くものは上に重ねる。 */
  .sheet{
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 22px) 20px
             calc(env(safe-area-inset-bottom) + 22px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .search.hidden{ display:none; }
  .search input{
    width:100%;
    border:none;
    border-bottom: 2px solid var(--rule);
    background: transparent;
    color: var(--ink);
    padding: 10px 0;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
  }
  .search input::placeholder{ color: var(--ink-faint); }
  .search input:focus{ outline:none; border-bottom-color: var(--ink); }
  .search ul{ list-style:none; margin: 2px 0 0; padding:0; }
  .search li{
    padding: 14px 0;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid var(--rule);
  }
  .search li:active{ color: var(--ink-soft); }
  .search li.empty{ color: var(--ink-faint); border:none; font-weight: 400; }

  details.note{ flex:none; margin-top: 5px; }
  details.note summary{
    list-style:none;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  details.note summary::-webkit-details-marker{ display:none; }
  details.note[open]{
    position: fixed;
    inset: 0;
    z-index: 20;
    margin: 0;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 22px) 20px
             calc(env(safe-area-inset-bottom) + 22px);
    overflow-y: auto;
  }
  details.note p{
    font-size: 12px;
    line-height: 1.75;
    color: var(--ink-faint);
    margin: 14px 0 0;
    max-width: 420px;
  }
  details.note a{ color: var(--ink-soft); }

  /* 背の低い画面でも一画面に収める */
  @media (max-height: 730px){
    .app{ padding-top: calc(env(safe-area-inset-top) + 10px);
          padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
    .risk{ min-height: 78px; max-height: 46vh; }
    .status-note{ margin-top: 10px; font-size: 12px; }
    .minmax{ margin-top: 3px; font-size: 14px; }
    .strip{ margin-top: 12px; }
    .strip .v{ font-size: 15px; margin-top: 3px; }
    .strip .now .v{ font-size: 19px; }
    .plot{ margin-top: 8px; }
    .plot-foot{ margin-top: 5px; }
    .plot-note{ margin-top: 5px; }
    .rows{ margin-top: 8px; }
    .row{ padding: 9px 0; }
    .row-value{ font-size: 19px; }
    .foot-row{ padding-top: 10px; }
    .dot, .glyph{ width: 40px; height: 40px; }
    .dot::before{ width: 15px; height: 15px; }
    .msg{ margin-top: 6px; }
    details.note{ margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="status" id="status" data-level="good">
    <div class="risk">
      <svg id="riskCircle" viewBox="0 0 200 200" role="img"
           aria-labelledby="statusWord"></svg>
    </div>
    <div class="sr-only" id="statusWord">読み込み中</div>
    <div class="sr-only" id="heroValue">--</div>
    <div class="status-note" id="statusNote"></div>
    <div class="minmax">
      <span><span class="k">max</span><span id="tMax">--</span><span class="u">°</span></span>
      <span><span class="k">min</span><span id="tMin">--</span><span class="u">°</span></span>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <div class="plot" id="plot">
    <svg id="chartPressure" viewBox="0 0 320 104" preserveAspectRatio="none"
         role="img" aria-label="気圧の推移"></svg>
    <div class="plot-foot">
      <span>−12h</span>
      <span class="mid" id="plotMid">現在</span>
      <span>+12h</span>
    </div>
    <div class="plot-note" id="plotNote"></div>
  </div>

  <div class="rows">
    <div class="row">
      <div class="row-value"><span id="tempValue">--</span><span class="u">°C</span></div>
      <div class="row-spark"><svg id="chartTemp" viewBox="0 0 160 24" preserveAspectRatio="none"
        role="img" aria-label="気温の推移"></svg></div>
    </div>
    <div class="row">
      <div class="row-value"><span id="humidityValue">--</span><span class="u">%</span></div>
      <div class="row-spark"><svg id="chartHumidity" viewBox="0 0 160 24" preserveAspectRatio="none"
        role="img" aria-label="湿度の推移"></svg></div>
    </div>
  </div>

  <div class="foot-row">
    <button class="dot" id="refreshBtn" type="button" aria-label="更新"></button>
    <span class="t" id="footTime"></span>
    <button class="glyph" id="placeBtn" type="button" aria-label="地名を変える">
      <span class="sr-only" id="placeName">…</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
      </svg>
    </button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="search sheet hidden" id="search">
    <input type="text" id="geoInput" placeholder="地名で検索" autocomplete="off"
           autocorrect="off" spellcheck="false" enterkeyhint="search">
    <ul id="geoResults"></ul>
  </div>

  <details class="note">
    <summary>体調の目安について</summary>
    <p>気圧・気温・湿度の変化にもとづく一般的な目安です。医学的な診断ではありません。体調がすぐれないときは無理をせず、症状が続く場合は医療機関にご相談ください。</p>
    <p>気象データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
    <p>表示中のバージョン: <span id="buildId">-</span></p>
  </details>

</div>

<script>
(function(){
  "use strict";

  // 画面が更新されたかを端末側で確かめられるようにする。
  var BUILD = "v32";
  var WINDOW_H   = 12;              // グラフに映す前後の時間
  var TICK_MS    = 5 * 60 * 1000;   // 取得と文面の入れ替えの間隔
  var REFRESH_MS = TICK_MS;
  var STALE_MS   = 3 * 60 * 60 * 1000;
  var LOCATION_KEY = "wxwidget.location.v2";
  var CACHE_KEY    = "wxwidget.cache.v2";

  var $ = function(id){ return document.getElementById(id); };
  var els = {
    placeBtn:$("placeBtn"), placeName:$("placeName"),
    heroValue:$("heroValue"),
    status:$("status"), statusWord:$("statusWord"), statusNote:$("statusNote"),
    riskCircle:$("riskCircle"),
    tMax:$("tMax"), tMin:$("tMin"),
    strip:$("strip"),
    plot:$("plot"), chartPressure:$("chartPressure"), plotMid:$("plotMid"),
    plotNote:$("plotNote"),
    tempValue:$("tempValue"), humidityValue:$("humidityValue"),
    chartTemp:$("chartTemp"), chartHumidity:$("chartHumidity"),
    refreshBtn:$("refreshBtn"), footTime:$("footTime"),
    search:$("search"), geoInput:$("geoInput"), geoResults:$("geoResults"),
    msg:$("msg")
  };

  function setMsg(t){ els.msg.textContent = t || ""; }

  // ---------- storage ----------

  function readJSON(k){
    try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; }
  }
  function writeJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function loadPref(){ return readJSON(LOCATION_KEY) || { mode:"auto" }; }
  function savePref(p){ writeJSON(LOCATION_KEY, p); }

  // ---------- geolocation ----------

  // getCurrentPosition の timeout は許可が下りてから数え始める仕様のため、
  // 許可プロンプトが放置されると永久に返らない。実時間で打ち切る。
  function withDeadline(promise, ms){
    return new Promise(function(resolve, reject){
      var settled = false;
      var timer = setTimeout(function(){
        if(!settled){ settled = true; reject(new Error("deadline")); }
      }, ms);
      promise.then(function(v){
        if(!settled){ settled = true; clearTimeout(timer); resolve(v); }
      }, function(e){
        if(!settled){ settled = true; clearTimeout(timer); reject(e); }
      });
    });
  }

  function getCurrentPosition(){
    return withDeadline(new Promise(function(resolve, reject){
      if(!("geolocation" in navigator)){ reject(new Error("unsupported")); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({ lat:pos.coords.latitude, lon:pos.coords.longitude }); },
        reject,
        { enableHighAccuracy:false, timeout:10000, maximumAge:60000 }
      );
    }), 12000);
  }

  function reverseName(lat, lon){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?latitude=" + lat +
      "&longitude=" + lon + "&count=1&language=ja&format=json")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.results && j.results[0] && j.results[0].name) || "現在地"; })
      .catch(function(){ return "現在地"; });
  }

  function geocodeSearch(q){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(q) + "&count=5&language=ja&format=json")
      .then(function(r){ if(!r.ok) throw new Error("geocode"); return r.json(); })
      .then(function(j){ return j.results || []; });
  }

  // ---------- weather ----------

  // hourly は毎時ちょうど、current.time は分を含むため両者は一致しない。
  // 観測地点の現地時刻から「今の時間帯」を直接求める。
  function computeNowIndex(times, utcOffsetSeconds){
    var localNow = new Date(Date.now() + (utcOffsetSeconds || 0) * 1000);
    var key = localNow.toISOString().slice(0, 13);
    for(var i = 0; i < times.length; i++){
      if(times[i].slice(0, 13) === key) return i;
    }
    var best = 0;
    for(var j = 0; j < times.length; j++){
      if(times[j].slice(0, 13) <= key) best = j; else break;
    }
    return best;
  }

  function fetchWeather(lat, lon){
    return fetch("https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + encodeURIComponent(lat) +
      "&longitude=" + encodeURIComponent(lon) +
      "&hourly=temperature_2m,relative_humidity_2m,pressure_msl" +
      // 毎時の値とは別に「現在値」も受け取る。毎時の刻みより短い間隔で
      // 更新されるため、数分おきに見にきたときに実際の値が動く。
      "&current=temperature_2m,relative_humidity_2m,pressure_msl" +
      "&past_days=1&forecast_days=2&timezone=auto", { cache:"no-store" }
    ).then(function(res){
      if(!res.ok) throw new Error("forecast-" + res.status);
      return res.json();
    }).then(function(json){
      var times = json.hourly.time;
      var cur = json.current || null;
      return {
        times: times,
        pressure: json.hourly.pressure_msl,
        temp: json.hourly.temperature_2m,
        humidity: json.hourly.relative_humidity_2m,
        nowIndex: computeNowIndex(times, json.utc_offset_seconds),
        utcOffset: json.utc_offset_seconds || 0,
        cur: cur ? {
          pressure: cur.pressure_msl,
          temp: cur.temperature_2m,
          humidity: cur.relative_humidity_2m
        } : null
      };
    });
  }

  // ---------- alarm ----------

  var THRESH = {
    warning:  { past3:-2, past6:-3, future6:-3 },
    serious:  { past3:-4, past6:-6, future6:-5 },
    critical: { past3:-6, past6:-9, future6:-8 }
  };
  var ORDER = { good:0, warning:1, serious:2, critical:3 };
  var WORD  = { good:"問題なし", warning:"注意", serious:"警戒", critical:"厳重警戒" };

  // 気圧ではなく湿度・気温で針が振れたときの言い方
  var NON_PRESSURE_WORD = {
    muggy:    "蒸し暑さが重なっています",
    humid:    "湿度が高い状態です",
    dry:      "空気が乾いています",
    hot:      "気温が高い状態です",
    cold:     "気温が低い状態です",
    tempFall: "気温が下がっています",
    tempRise: "気温が上がっています",
    coolDown: "この先気温が下がります",
    swing:    "気温差が大きい一日です"
  };

  function back(a,i,n){ var j=i-n; if(j<0||i>=a.length||a[j]==null||a[i]==null) return null; return a[i]-a[j]; }
  function ahead(a,i,n){ var j=i+n; if(j>=a.length||a[j]==null||a[i]==null) return null; return a[j]-a[i]; }
  function levelFor(d,k){
    if(d==null) return "good";
    if(d<=THRESH.critical[k]) return "critical";
    if(d<=THRESH.serious[k])  return "serious";
    if(d<=THRESH.warning[k])  return "warning";
    return "good";
  }

  // いま何が起きているかを、気圧の動き方そのもので言い表す。
  function pastPhrase(r){
    if(r == null)   return "確認中";
    if(r <= -6)     return "急降下しています";
    if(r <= -4)     return "大きく下降中";
    if(r <= -2)     return "下降しています";
    if(r <= -0.8)   return "ゆるやかに低下";
    if(r <   0.8)   return "落ち着いています";
    if(r <   2.5)   return "ゆるやかに回復";
    return "上昇しています";
  }
  function futurePhrase(r){
    if(r <= -8) return "まもなく急降下";
    if(r <= -5) return "まもなく大きく下降";
    return "これから下がります";
  }

  // 気圧以外の目立つ変化を拾う。体調に響きやすい順に並べる。
  function weatherNotes(d){
    var i=d.nowIndex, out=[];
    var hum=d.humidity[i], tp=d.temp[i];
    var dT3=back(d.temp,i,3), fT6=ahead(d.temp,i,6);
    var day=dayRange(d);

    if(dT3!=null && dT3<=-4) out.push({k:"tempFall", t:"3時間で気温 "+dT3.toFixed(1)+"°"});
    if(dT3!=null && dT3>=5)  out.push({k:"tempRise", t:"3時間で気温 +"+dT3.toFixed(1)+"°"});
    if(hum!=null && tp!=null && hum>=80 && tp>=24) out.push({k:"muggy", t:"湿度 "+Math.round(hum)+"%"});
    else if(hum!=null && hum>=85) out.push({k:"humid", t:"湿度 "+Math.round(hum)+"%"});
    else if(hum!=null && hum<=30) out.push({k:"dry",   t:"湿度 "+Math.round(hum)+"%"});
    if(day && day.hi!=null && day.lo!=null && (day.hi-day.lo)>=10)
      out.push({k:"swing", t:"気温差 "+Math.round(day.hi-day.lo)+"°"});
    if(fT6!=null && fT6<=-5) out.push({k:"coolDown", t:"この先6時間 "+fT6.toFixed(1)+"°"});
    if(tp!=null && tp<=5)  out.push({k:"cold", t:"気温 "+tp.toFixed(1)+"°"});
    if(tp!=null && tp>=30) out.push({k:"hot",  t:"気温 "+tp.toFixed(1)+"°"});
    return out;
  }

  function dayRange(d){
    var today = new Date(Date.now() + (d.utcOffset||0)*1000).toISOString().slice(0,10);
    var hi=null, lo=null;
    for(var i=0;i<d.times.length;i++){
      if(d.times[i].slice(0,10)!==today) continue;
      var t=d.temp[i];
      if(t==null) continue;
      if(hi==null||t>hi) hi=t;
      if(lo==null||t<lo) lo=t;
    }
    return { hi:hi, lo:lo };
  }

  // ゲージの目盛り 0〜9。気圧の下がり方を主軸に、湿度と気温を上乗せする。
  //   気圧 … 0.7hPa/3時間 ごとに1点。6時間と予報も同じ重みに揃えて最大を採る
  //   湿度 … 62%を超えたぶんを9で割る。蒸し暑さは別に上乗せ（最大4.5点）
  //   気温 … 下がり幅と、極端な暑さ寒さ（最大1.5点）
  function riskOf(d){
    var p = d.pressure, i = d.nowIndex;
    var d3 = back(p,i,3), d6 = back(p,i,6), f6 = ahead(p,i,6);
    function fall(x){ return (x == null) ? 0 : Math.max(0, -x); }

    var sp = Math.max(
      fall(d3) / 0.7,     // -2hPa/3時間 で 3点
      fall(d6) / 1.25,
      fall(f6) / 1.5
    );

    var hum = d.humidity[i], tp = d.temp[i];
    var sh = 0;
    if(hum != null){
      if(hum > 62) sh += (hum - 62) / 9;         // 80%で2.0点、90%で3.1点
      if(hum <= 32) sh += (32 - hum) / 11;       // 乾燥も負荷とみなす
      if(hum >= 72 && tp != null && tp >= 25) sh += 1.0;  // 蒸し暑さ
    }
    sh = Math.min(4.5, sh);

    var st = 0;
    var dT3 = back(d.temp, i, 3), fT6 = ahead(d.temp, i, 6);
    st += fall(dT3) / 4;
    st += fall(fT6) / 6;
    if(tp != null && (tp <= 5 || tp >= 31)) st += 0.8;
    st = Math.min(1.5, st);

    return Math.max(0, Math.min(9, Math.round(sp + sh + st)));
  }

  function computeAlarm(d){
    var p=d.pressure, i=d.nowIndex;
    var d3=back(p,i,3), d6=back(p,i,6), f6=ahead(p,i,6);
    var lv=[levelFor(d3,"past3"), levelFor(d6,"past6"), levelFor(f6,"future6")];
    var level="good";
    lv.forEach(function(l){ if(ORDER[l]>ORDER[level]) level=l; });

    // 先の下降のほうが重いときは、これから起きることを見出しにする
    var futureLeads = ORDER[lv[2]] > Math.max(ORDER[lv[0]], ORDER[lv[1]]);
    var word = futureLeads ? futurePhrase(f6) : pastPhrase(d3);

    var notes = weatherNotes(d);
    var pLevel = level;   // 注記の組み立ては気圧の段階で決める

    // 気圧が穏やかでも湿度や気温で針が振れることがある。針と、
    // 色・読み上げ・対策の見出しが食い違わないよう、段階を引き上げる。
    var risk = riskOf(d);
    var byRisk = risk>=7 ? "critical" : risk>=5 ? "serious" : risk>=3 ? "warning" : "good";
    if(ORDER[byRisk] > ORDER[level]){
      level = byRisk;
      word = NON_PRESSURE_WORD[notes.length ? notes[0].k : ""] || "気圧以外の負荷があります";
    }
    var lines = [];
    var note = "";
    if(pLevel!=="good"){
      // 「低下」で向きは伝わるので数値の符号は外す
      var c=[];
      if(d3!=null&&ORDER[lv[0]]>0) c.push({v:d3,t:"3時間 "+d3.toFixed(1)+"hPa"});
      if(d6!=null&&ORDER[lv[1]]>0) c.push({v:d6,t:"6時間 "+d6.toFixed(1)+"hPa"});
      if(f6!=null&&ORDER[lv[2]]>0) c.push({v:f6,t:"この先6時間 "+f6.toFixed(1)+"hPa"});
      c.sort(function(a,b){ return a.v-b.v; });
      if(c.length) lines.push(c[0].t);
      if(notes.length) lines.push(notes[0].t);
    }else{
      // 穏やかなときこそ、気圧以外の変化を伝える
      if(notes.length) lines.push(notes[0].t);
      if(notes.length > 1) lines.push(notes[1].t);
    }
    note = lines.join(" · ");
    return { level:level, word:word, note:note, lines:lines, notes:notes,
             risk: risk,
             d3:d3, d6:d6, f6:f6, hum:d.humidity[i], temp:d.temp[i] };
  }

  // ---------- self-care ----------
  // ---------- format ----------

  function describeAge(ms){
    var min=Math.floor((Date.now()-ms)/60000);
    if(min<1) return "たった今";
    if(min<60) return min+"分前";
    var h=Math.floor(min/60);
    if(h<24) return h+"時間前";
    return Math.floor(h/24)+"日前";
  }
  function hhmm(iso){ return iso.slice(11,16); }
  function hourOf(iso){ return iso.slice(11,13); }
  function localClock(off){ return new Date(Date.now()+(off||0)*1000).toISOString().slice(11,16); }

  // ---------- svg ----------

  // グラフは全期間ではなく現在の前後 WINDOW_H 時間だけを映す。
  function win(){
    var d=state.data;
    return {
      s: Math.max(0, d.nowIndex - WINDOW_H),
      e: Math.min(d.times.length - 1, d.nowIndex + WINDOW_H)
    };
  }

  var NS="http://www.w3.org/2000/svg";
  function mk(tag,a){ var n=document.createElementNS(NS,tag); for(var k in a) n.setAttribute(k,a[k]); return n; }
  function clear(s){ while(s.firstChild) s.removeChild(s.firstChild); }
  function scaleOf(vals,minSpan,edgePad){
    var v=vals.filter(function(x){ return x!=null; });
    if(!v.length) return null;
    var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v), span=hi-lo;
    if(span<minSpan){ var pad=(minSpan-span)/2; lo-=pad; hi+=pad; }
    else { var e=span*(edgePad==null ? 0.15 : edgePad); lo-=e; hi+=e; }
    // ゼロ線を真ん中に置くため、上下の振れ幅をそろえる
    var mid=(lo+hi)/2, half=Math.max(mid-lo, hi-mid);
    return {lo:mid-half, hi:mid+half};
  }
  function pathOf(pts){
    return pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join("");
  }

  // 主グラフ。塗りも目盛りも置かず、線一本と現在位置だけで読ませる。
  // 3時間あたりの下がり幅が注意水準（-2hPa）に達する区間を洗い出す。
  // 連続する区間はひと続きにまとめる。
  function cautionBands(p){
    var bands=[], cur=null;
    for(var i=0; i+3 < p.length; i++){
      if(p[i]==null || p[i+3]==null){ continue; }
      var drop = p[i+3] - p[i];
      if(drop <= THRESH.warning.past3){
        if(cur) cur.e = i+3;
        else cur = { s:i, e:i+3 };
      }else if(cur){
        bands.push(cur); cur = null;
      }
    }
    if(cur) bands.push(cur);
    return bands;
  }

  // 主グラフ。縦軸は気圧そのものではなく、1時間あたりの変化量。
  // 音の波形の振幅がエネルギーであるのと同じで、大きく振れているほど
  // 気圧が速く動いている。赤い横線が「変化なし」。
  // 下に振れていれば下降中、上なら上昇中。値のある側を長く、反対側を
  // 0.45倍で取り、音の波形の非対称さに合わせる。塗りつぶしの面で描く。
  var MIRROR = 0.45;
  var RATE_FLOOR = 1.0;   // 目盛りの下限 hPa/時。穏やかな日を煽らない
  function drawMain(svg, d, focus){
    clear(svg);
    var v=d.pressure, now=d.nowIndex, W=320, H=104, top=5, bot=5;
    var w=win(), span=w.e-w.s;
    if(span<1) return;
    var ph=H-top-bot, yb=top+ph/2;
    function X(i){ return ((i-w.s)/span)*W; }

    // 1時間でどれだけ動いたか。添字は d.pressure と同じ。
    var rate=[], i;
    for(i=0;i<v.length;i++){
      rate[i] = (i>0 && v[i]!=null && v[i-1]!=null) ? (v[i]-v[i-1]) : null;
    }
    var mx=0;
    for(i=w.s;i<=w.e;i++) if(rate[i]!=null) mx=Math.max(mx, Math.abs(rate[i]));
    var lim = Math.max(RATE_FLOOR, mx*1.06);
    var amp = ph * 0.45;
    // 下降（負）を下へ振る
    function dev(r){ return -(r/lim)*amp; }

    // 下敷きの罫
    for(var g=0;g<=6;g++){
      var ry = top + (ph/6)*g;
      svg.appendChild(mk("line",{ x1:0, x2:W, y1:ry, y2:ry,
        stroke:"var(--rule)", "stroke-width":0.6, opacity:.55 }));
    }

    // 要注意の時間帯。判定は全期間で行い、映す範囲に切り詰める。
    cautionBands(v).forEach(function(b){
      var bs=Math.max(b.s, w.s), be=Math.min(b.e, w.e);
      if(be<=bs) return;
      svg.appendChild(mk("rect",{
        x:X(bs), y:0, width:Math.max(X(be)-X(bs), 1), height:H,
        fill:"var(--band)"
      }));
    });

    // ゼロ線。柱の下に敷く。
    svg.appendChild(mk("line",{ x1:0, x2:W, y1:yb, y2:yb,
      stroke:"var(--accent)", "stroke-width":1.3 }));

    // 波形は面で塗る。参考画像と同じく、これまでを濃く、この先をうすく。
    function areaOf(A, B){
      if(A.length < 2) return null;
      var d = pathOf(A), k;
      for(k = B.length - 1; k >= 0; k--){
        d += "L" + B[k][0].toFixed(1) + "," + B[k][1].toFixed(1);
      }
      return d + "Z";
    }
    var pastA=[], pastB=[], futA=[], futB=[];
    for(i=w.s;i<=w.e;i++){
      if(rate[i]==null) continue;
      var x=X(i), q=dev(rate[i]);
      var yA=yb+q, yB=yb-q*MIRROR;
      // 動きのない時間帯でも一本の帯として見えるだけの厚みは残す
      if(Math.abs(yA-yB) < 1.8){ yA = yb+0.9; yB = yb-0.9; }
      if(i<=now){ pastA.push([x,yA]); pastB.push([x,yB]); }
      if(i>=now){ futA.push([x,yA]);  futB.push([x,yB]); }
    }
    var dFut = areaOf(futA, futB);
    if(dFut) svg.appendChild(mk("path",{ d:dFut, fill:"var(--ink)", opacity:.34 }));
    var dPast = areaOf(pastA, pastB);
    if(dPast) svg.appendChild(mk("path",{ d:dPast, fill:"var(--ink)" }));

    // 縦軸が気圧そのものでないことがわかるよう、単位だけ添える
    var unit = mk("text",{ x:2, y:9, "font-size":7.5, fill:"var(--ink-faint)",
      "letter-spacing":.3 });
    unit.textContent = "hPa/h";
    svg.appendChild(unit);

    // 両端の印
    svg.appendChild(mk("path",{ d:"M0 "+(yb-3.6)+"L4.6 "+yb+"L0 "+(yb+3.6)+"Z",
      fill:"var(--accent)" }));
    svg.appendChild(mk("path",{ d:"M"+W+" "+(yb-3.6)+"L"+(W-4.6)+" "+yb+"L"+W+" "+(yb+3.6)+"Z",
      fill:"var(--accent)" }));

    // いま、またはなぞっている位置
    var at = (focus==null) ? now : focus;
    if(rate[at]!=null && at>=w.s && at<=w.e){
      var cx=X(at), cy=yb+dev(rate[at]);
      svg.appendChild(mk("line",{ x1:cx, x2:cx, y1:0, y2:H,
        stroke:"var(--ink)", "stroke-width":1, opacity:.5 }));
      svg.appendChild(mk("circle",{ cx:cx, cy:cy, r:5, fill:"var(--bg)" }));
      svg.appendChild(mk("circle",{ cx:cx, cy:cy, r:3.2, fill:"var(--ink)" }));
    }
  }

  function drawSpark(svg, vals, now, focus){
    clear(svg);
    var W=160,H=24,pad=3.5;
    var w=win(), span=w.e-w.s;
    var sc=scaleOf(vals.slice(w.s, w.e+1), 4); if(!sc || span<1) return;
    function X(i){ return ((i-w.s)/span)*W; }
    function Y(x){ return pad+(1-(x-sc.lo)/(sc.hi-sc.lo))*(H-pad*2); }
    var past=[],future=[];
    for(var i=w.s;i<=w.e;i++){
      if(vals[i]==null) continue;
      var pt=[X(i),Y(vals[i])];
      if(i<=now) past.push(pt);
      if(i>=now) future.push(pt);
    }
    if(past.length>1) svg.appendChild(mk("path",{ d:pathOf(past), fill:"none",
      stroke:"var(--ink)", "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round" }));
    if(future.length>1) svg.appendChild(mk("path",{ d:pathOf(future), fill:"none",
      stroke:"var(--ink)", "stroke-width":2, opacity:.4, "stroke-linejoin":"round",
      "stroke-linecap":"round", "stroke-dasharray":"1 3.4" }));

    // 気圧のグラフをなぞったとき、気温・湿度の印も同じ時刻へ移す。
    var at = (focus==null) ? now : focus;
    if(vals[at]!=null && at>=w.s && at<=w.e){
      if(focus!=null){
        svg.appendChild(mk("line",{ x1:X(at), x2:X(at), y1:0, y2:H,
          stroke:"var(--rule)", "stroke-width":1.4 }));
      }
      svg.appendChild(mk("circle",{ cx:X(at), cy:Y(vals[at]), r:4, fill:"var(--bg)" }));
      svg.appendChild(mk("circle",{ cx:X(at), cy:Y(vals[at]), r:2.4, fill:"var(--ink)" }));
    }
  }

  // ---------- render ----------

  var state = { data:null, fetchedAt:0, place:"", scrub:null };

  function renderHero(animate){
    var d=state.data; if(!d) return;
    var i = (state.scrub==null) ? d.nowIndex : state.scrub;
    var live = (state.scrub==null && d.cur) ? d.cur : null;
    var pv = live && live.pressure!=null ? live.pressure : d.pressure[i];
    var shown = pv==null ? "--" : String(Math.round(pv));
    els.heroValue.textContent = shown;
    var tv = live && live.temp!=null ? live.temp : d.temp[i];
    var hv = live && live.humidity!=null ? live.humidity : d.humidity[i];
    els.tempValue.textContent = tv==null ? "--" : tv.toFixed(1);
    els.humidityValue.textContent = hv==null ? "--" : Math.round(hv);
    els.plotMid.textContent = (state.scrub==null)
      ? "現在"
      : hhmm(d.times[i]) + "  " + (pv==null ? "--" : Math.round(pv)) + "hPa";
  }

  // その地点の「今日」の最高・最低気温。時刻は現地時刻で並んでいる。
  function renderMinMax(){
    var d=state.data; if(!d) return;
    var today = new Date(Date.now() + (d.utcOffset||0)*1000).toISOString().slice(0,10);
    var hi=null, lo=null;
    for(var i=0;i<d.times.length;i++){
      if(d.times[i].slice(0,10) !== today) continue;
      var t=d.temp[i];
      if(t==null) continue;
      if(hi==null || t>hi) hi=t;
      if(lo==null || t<lo) lo=t;
    }
    els.tMax.textContent = hi==null ? "--" : hi.toFixed(1);
    els.tMin.textContent = lo==null ? "--" : lo.toFixed(1);
  }

  // 横線を積んで円をつくる。下から点灯し、満ちるほど負荷が大きい。
  // 参考画像の「線で塗った円」を、そのまま 0〜9 の目盛りとして使う。
  var RISK_ROWS = 27;
  function drawRisk(risk){
    var svg = els.riskCircle;
    if(!svg) return;
    var R = 92, CX = 100, CY = 100, GAP = 7;
    var step = (R * 1.91) / (RISK_ROWS - 1);
    var lit  = Math.round(RISK_ROWS * (risk + 1) / 10);

    // 段が変わったときだけ組み直す。点灯の切り替えは opacity に任せる。
    if(svg.childNodes.length !== RISK_ROWS * 2){
      clear(svg);
      for(var k=0;k<RISK_ROWS;k++){
        var dy = (k - (RISK_ROWS - 1) / 2) * step;
        var hw = Math.sqrt(Math.max(0, R*R - dy*dy));
        var y  = CY + dy;
        [[CX-hw, CX-GAP],[CX+GAP, CX+hw]].forEach(function(seg){
          var line = mk("line",{
            x1:Math.min(seg[0],seg[1]), x2:Math.max(seg[0],seg[1]), y1:y, y2:y,
            "stroke-width": step*0.62
          });
          line.setAttribute("class","rr");
          // 下の段から順に灯る
          line.style.transitionDelay = ((RISK_ROWS-1-k) * 14) + "ms";
          if(seg[1]-seg[0] < 3) line.setAttribute("visibility","hidden");
          svg.appendChild(line);
        });
      }
    }
    var rows = svg.childNodes;
    for(var i=0;i<rows.length;i++){
      var row = Math.floor(i/2);
      var on = row >= RISK_ROWS - lit;
      rows[i].setAttribute("class", on ? "rr on" : "rr");
    }
  }

  function renderStatus(){
    var d=state.data; if(!d) return;
    var a=computeAlarm(d);
    els.status.setAttribute("data-level", a.level);
    els.status.setAttribute("data-risk", a.risk);
    drawRisk(a.risk);
    els.statusWord.textContent = a.word;
    els.statusNote.textContent = (Date.now()-state.fetchedAt > STALE_MS)
      ? describeAge(state.fetchedAt)+"のデータです。更新してください。"
      : a.lines.join(" · ");
  }

  // 3時間ごとの気圧予報。Weat の時刻ストリップにあたる部分。
  // 絶対値を整数で並べると、このアプリが見たい数hPaの変化が丸めで消えるため、
  // 先頭だけ実測値、以降は「今からの変化」を符号つきで示す。
  function renderStrip(){
    var d=state.data; if(!d) return;
    var base = d.pressure[d.nowIndex];
    // 実測値があればそちらを「今」として出す（差分は予報の基準値から測る）
    var shownNow = (d.cur && d.cur.pressure!=null) ? d.cur.pressure : base;
    els.strip.innerHTML="";
    for(var k=0;k<5;k++){      // 今 / +3 / +6 / +9 / +12 時間。グラフの右端に合わせる
      var i=d.nowIndex+k*3;
      if(i>=d.times.length) break;
      var cell=document.createElement("div");
      if(k===0) cell.className="now";

      var h=document.createElement("div");
      h.className="h";
      h.textContent = (k===0) ? "今" : hourOf(d.times[i])+"時";

      var v=document.createElement("div");
      v.className="v";
      if(d.pressure[i]==null || base==null){
        v.textContent = "--";
      }else if(k===0){
        v.textContent = Math.round(shownNow);
      }else{
        var diff = d.pressure[i] - base;
        var r = Math.abs(diff) < 0.05 ? 0 : diff;   // -0.0 を出さない
        v.textContent = (r > 0 ? "+" : (r < 0 ? "-" : "±")) + Math.abs(r).toFixed(1);
      }
      cell.appendChild(h); cell.appendChild(v);
      els.strip.appendChild(cell);
    }
  }

  // 要注意の時間帯があるときだけ、帯の意味を書き添える。
  function renderPlotNote(){
    var d=state.data; if(!d) return;
    var w=win();
    var visible = cautionBands(d.pressure).some(function(b){
      return Math.min(b.e, w.e) > Math.max(b.s, w.s);
    });
    els.plotNote.textContent = visible ? "要注意" : "";
  }

  function drawCharts(focus){
    var d=state.data; if(!d) return;
    drawMain(els.chartPressure, d, focus);
    drawSpark(els.chartTemp, d.temp, d.nowIndex, focus);
    drawSpark(els.chartHumidity, d.humidity, d.nowIndex, focus);
  }

  function renderAll(animate){
    var d=state.data; if(!d) return;
    renderHero(animate);
    renderStatus();
    renderMinMax();
    renderStrip();
    renderPlotNote();
    drawCharts(state.scrub);
    els.footTime.textContent = localClock(d.utcOffset);
  }

  // ---------- scrub ----------

  // なぞる対象はどのグラフでもよい。時間軸はすべて共通なので、
  // 触れている要素の幅を基準に位置を求める。
  var scrubbing=false, scrubEl=null;

  function indexFromX(clientX){
    var d=state.data; if(!d || !scrubEl) return null;
    var r=scrubEl.getBoundingClientRect();
    if(!r.width) return null;
    var t=Math.max(0, Math.min(1, (clientX-r.left)/r.width));
    var w=win();
    return w.s + Math.round(t*(w.e-w.s));
  }
  function sStart(e){
    if(!state.data) return;
    scrubEl = e.currentTarget.querySelector("svg") || e.currentTarget;
    scrubbing=true;
    sMove(e);
  }
  function sMove(e){
    if(!scrubbing||!state.data) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var i = indexFromX(x);
    if(i==null||i===state.scrub) return;
    state.scrub=i;
    renderHero();
    drawCharts(i);
  }
  function sEnd(){
    if(!scrubbing) return;
    scrubbing=false; scrubEl=null; state.scrub=null;
    renderHero();
    if(state.data) drawCharts(null);
  }

  [els.plot, els.chartTemp.parentNode, els.chartHumidity.parentNode].forEach(function(el){
    el.addEventListener("touchstart", sStart, {passive:true});
    el.addEventListener("touchmove",  sMove,  {passive:true});
    el.addEventListener("touchend",   sEnd);
    el.addEventListener("touchcancel",sEnd);
    el.addEventListener("mousedown",  sStart);
  });
  window.addEventListener("mousemove", sMove);
  window.addEventListener("mouseup",   sEnd);

  // ---------- data flow ----------

  var busy=false;
  function setBusy(on){
    busy=on;
    // 言葉を置かず、点そのものを脈打たせて取得中を示す
    els.refreshBtn.setAttribute("aria-label", on ? "更新中" : "更新");
    els.refreshBtn.setAttribute("aria-busy", on ? "true" : "false");
  }

  function applyCache(){
    var c=readJSON(CACHE_KEY);
    if(!c||!c.data) return false;
    state.data=c.data; state.fetchedAt=c.fetchedAt; state.place=c.place;
    els.placeName.textContent=c.place;
    renderAll(false);
    return true;
  }

  function load(place, lat, lon){
    setBusy(true); setMsg("");
    return fetchWeather(lat, lon).then(function(data){
      state.data=data; state.fetchedAt=Date.now(); state.place=place; state.scrub=null;
      els.placeName.textContent=place;
      writeJSON(CACHE_KEY,{place:place,lat:lat,lon:lon,data:data,fetchedAt:Date.now()});
      renderAll(true); setBusy(false);
    }).catch(function(err){
      setBusy(false); console.error(err);
      var had = state.data!=null;
      setMsg(had ? "更新できませんでした。表示は"+describeAge(state.fetchedAt)+"のデータです。"
                 : "データを取得できませんでした。通信環境を確認してください。");
      if(had) renderStatus();
    });
  }

  // 起動・復帰のたびに呼ぶ。auto なら現在地を取り直してから読み込む。
  function start(){
    if(busy) return Promise.resolve();
    var pref=loadPref();
    if(pref.mode==="manual") return load(pref.name, pref.lat, pref.lon);

    setBusy(true);
    return getCurrentPosition().then(function(pos){
      setBusy(false);
      var c=readJSON(CACHE_KEY);
      var moved = !c || c.place==null ||
        Math.abs((c.lat||0)-pos.lat)>0.05 || Math.abs((c.lon||0)-pos.lon)>0.05;
      if(!moved) return load(c.place, pos.lat, pos.lon);
      return reverseName(pos.lat,pos.lon).then(function(name){
        return load(name, pos.lat, pos.lon);
      });
    }).catch(function(){
      setBusy(false);
      var c=readJSON(CACHE_KEY);
      if(c && c.lat!=null){
        setMsg("現在地を取得できないため、前回の地点を表示しています。");
        return load(c.place, c.lat, c.lon);
      }
      setMsg("現在地を取得できません。地名で検索してください。");
      openSearch();
    });
  }

  // ---------- search ----------

  function openSearch(){ els.search.classList.remove("hidden"); els.geoInput.focus(); }
  function closeSearch(){
    els.search.classList.add("hidden");
    els.geoResults.innerHTML=""; els.geoInput.value="";
  }
  els.placeBtn.addEventListener("click", function(){
    if(els.search.classList.contains("hidden")) openSearch(); else closeSearch();
  });

  var timer=null;
  els.geoInput.addEventListener("input", function(){
    clearTimeout(timer);
    var q=els.geoInput.value.trim();
    if(!q){ els.geoResults.innerHTML=""; return; }
    timer=setTimeout(function(){ runSearch(q); }, 300);
  });
  function runSearch(q){
    geocodeSearch(q).then(function(rs){
      if(!rs.length){ els.geoResults.innerHTML='<li class="empty">見つかりません</li>'; return; }
      els.geoResults.innerHTML="";
      rs.forEach(function(r){
        var li=document.createElement("li");
        li.textContent=[r.name,r.admin1].filter(Boolean).join("、");
        li.addEventListener("click", function(){
          savePref({mode:"manual",name:r.name,lat:r.latitude,lon:r.longitude});
          closeSearch();
          load(r.name,r.latitude,r.longitude);
        });
        els.geoResults.appendChild(li);
      });
    }).catch(function(){
      els.geoResults.innerHTML='<li class="empty">検索できません</li>';
    });
  }

  // 現在地に戻す導線: 更新の長押し
  var hold=null;
  els.refreshBtn.addEventListener("touchstart", function(){
    hold=setTimeout(function(){
      savePref({mode:"auto"});
      setMsg("現在地に戻しました。");
      start();
    }, 600);
  }, {passive:true});
  ["touchend","touchcancel","touchmove"].forEach(function(ev){
    els.refreshBtn.addEventListener(ev, function(){ clearTimeout(hold); });
  });
  els.refreshBtn.addEventListener("click", function(){ start(); });

  // ---------- lifecycle ----------

  // ホーム画面から起動したとき、アプリは再読み込みされず「復帰」することがある。
  // 復帰も起動と同じ扱いにして、必ず現在時刻・現在地を取り直す。
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible") start();
  });
  window.addEventListener("pageshow", function(e){ if(e.persisted) start(); });
  setInterval(function(){
    if(document.visibilityState!=="visible") return;
    start();
    // 取得が失敗しても、判定文と対策は時計に沿って入れ替える
    if(state.data) renderStatus();
  }, TICK_MS);

  var buildEl = document.getElementById("buildId");
  if(buildEl) buildEl.textContent = BUILD;

  applyCache();
  start();

  if("serviceWorker" in navigator && window.isSecureContext){
    // ホーム画面から起動したアプリは、再読み込みされず前回の画面のまま
    // 「再開」することがある。その状態では新しい版を配信しても画面が
    // 古いままになるので、入れ替わりを検知して一度だけ読み込み直す。
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloading) return;
      reloading = true;
      location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        // 復帰のたびに新しい版の有無を確かめる。これがないと、
        // 再開しかしない端末では更新の確認そのものが走らない。
        document.addEventListener("visibilitychange", function(){
          if(document.visibilityState === "visible") reg.update();
        });
        setInterval(function(){ reg.update(); }, REFRESH_MS);
        reg.update();
      }).catch(function(e){
        console.warn("sw registration failed", e);
      });
    });
  }
})();
</script>
</body>
</html>
