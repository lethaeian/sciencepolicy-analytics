# XcodeGen 用の定義。`brew install xcodegen && xcodegen` で .xcodeproj を作る。
# 手で作る場合は README の「2. 手で作る」を見ること。
name: Kiatsu
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""        # 自分のチームIDを入れるか、Xcode の Signing で選ぶ
    CODE_SIGN_STYLE: Automatic

targets:
  Kiatsu:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kiatsu
        INFOPLIST_KEY_CFBundleDisplayName: 気圧・体調
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: いまいる場所の気圧を調べるために使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfacePhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: KiatsuWidgetExtension
        embed: true
    scheme:
      testTargets:
        - KiatsuTests

  KiatsuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    resources:
      - path: Tests/Fixtures
    dependencies:
      - target: Kiatsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kiatsu.tests

  KiatsuWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kiatsu.widget
        INFOPLIST_KEY_CFBundleDisplayName: 気圧・体調
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
